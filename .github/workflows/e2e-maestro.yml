name: E2E Maestro Tests

on:
  workflow_call:
    inputs:
      platform:
        description: 'Target platform (android/ios)'
        required: false
        type: string
        default: 'android'
      app-artifact:
        description: 'Name of the app artifact to download (APK for Android, .app.zip for iOS)'
        required: true
        type: string
      suites:
        description: 'JSON array of test suites to run'
        required: true
        type: string
    secrets:
      QUITOQUE_USERNAME:
        required: false
      QUITOQUE_PASSWORD:
        required: false

jobs:
  e2e-tests:
    name: E2E ${{ inputs.platform }} (${{ matrix.suite }})
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(inputs.suites) }}
    steps:
      - name: Select Xcode 26.2
        if: inputs.platform == 'ios'
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Java 17 for Maestro
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Maestro CLI
        uses: dniHze/maestro-test-action@v1
        with:
          version: '2.8.0'

      # ============================================
      # Android Setup
      # ============================================
      - name: Setup Android SDK
        if: inputs.platform == 'android'
        uses: android-actions/setup-android@v4

      - name: Download APK
        if: inputs.platform == 'android'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app-artifact }}

      - name: Enable KVM
        if: inputs.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E tests (Android)
        if: inputs.platform == 'android'
        # Under the job budget: a job-level timeout cancels the `if: always()` uploads, losing the logs.
        timeout-minutes: 200
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -wipe-data -memory 4096 -cores 4
          script: bash .github/scripts/run-e2e-android.sh ${{ matrix.suite }}
        env:
          QUITOQUE_USERNAME: ${{ secrets.QUITOQUE_USERNAME }}
          QUITOQUE_PASSWORD: ${{ secrets.QUITOQUE_PASSWORD }}

      # ============================================
      # iOS Setup
      # ============================================
      - name: Download iOS app
        if: inputs.platform == 'ios'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app-artifact }}

      - name: Unzip iOS app bundle
        if: inputs.platform == 'ios'
        run: |
          unzip -q *.zip
          rm -f *.zip
          echo "📱 iOS app bundle extracted"
          ls -la *.app || echo "No .app found at root level"

      - name: Disable macOS background services
        if: inputs.platform == 'ios'
        run: |
          sudo mdutil -a -i off
          sudo tmutil disable

      - name: Boot iOS Simulator
        if: inputs.platform == 'ios'
        id: simulator
        uses: futureware-tech/simulator-action@v5
        with:
          model: 'iPhone 16e'
          # 26.2 is the only 26.x runtime carrying an iPhone 16e.
          os_version: '26.2'
          wait_for_boot: true
          erase_before_boot: false
          shutdown_after_job: true

      - name: Disable hardware keyboard
        if: inputs.platform == 'ios'
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          echo "⌨️ Disabling hardware keyboard for device $UDID..."
          PLIST=~/Library/Preferences/com.apple.iphonesimulator.plist
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences:$UDID:ConnectHardwareKeyboard bool false" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :DevicePreferences:$UDID:ConnectHardwareKeyboard false" "$PLIST"
          echo "✅ Hardware keyboard disabled"

      - name: Configure simulator for testing
        if: inputs.platform == 'ios'
        run: |
          xcrun simctl spawn booted defaults write -g UIAnimationDragCoefficient 0.001
          xcrun simctl spawn booted defaults write -g NSAutomaticWindowAnimationsEnabled -bool false
          xcrun simctl spawn booted defaults write com.apple.Accessibility ReduceMotion -bool YES
          xcrun simctl spawn booted defaults write -g KeyboardAutocapitalization -bool NO
          xcrun simctl spawn booted defaults write -g KeyboardAutocorrection -bool NO
          xcrun simctl spawn booted defaults write -g KeyboardSpellChecking -bool NO
          xcrun simctl spawn booted defaults write com.apple.assistant.support "Assistant Enabled" -bool NO
          xcrun simctl spawn booted defaults write com.apple.Accessibility ReduceTransparencyEnabled -bool YES
          # Decimal separators follow the device region, and the runner default changed between
          # iOS 18.6 and 26.2, silently flipping every "133[.]33 g" assertion. No reboot needed:
          # Maestro relaunches the app per flow, so each process reads the region fresh.
          xcrun simctl spawn booted defaults write -g AppleLocale -string "en_US"
          xcrun simctl spawn booted defaults write -g AppleLanguages -array "en-US"
          xcrun simctl spawn booted killall -HUP cfprefsd 2>/dev/null || true
          echo "🌍 Simulator region pinned to $(xcrun simctl spawn booted defaults read -g AppleLocale)"

      - name: Freeze simulator status bar
        if: inputs.platform == 'ios'
        run: |
          # --time must not end in ":00" — iOS 26 rejects "HH:00" as non-ISO.
          xcrun simctl status_bar booted override \
            --time "9:41" \
            --batteryState charged \
            --batteryLevel 100 \
            --cellularBars 4 \
            --wifiBars 3 \
            || echo "::warning::Status bar override failed — clock/battery animation not frozen"

      - name: Run E2E tests (iOS)
        if: inputs.platform == 'ios'
        # Under the job budget: a job-level timeout cancels the `if: always()` uploads, losing the logs.
        timeout-minutes: 200
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 360000
          QUITOQUE_USERNAME: ${{ secrets.QUITOQUE_USERNAME }}
          QUITOQUE_PASSWORD: ${{ secrets.QUITOQUE_PASSWORD }}
        run: bash .github/scripts/run-e2e-ios.sh ${{ matrix.suite }}

      - name: Collect iOS app log file
        if: always() && inputs.platform == 'ios'
        run: bash .github/scripts/collect-ios-logs.sh ${{ matrix.suite }} ${{ steps.simulator.outputs.udid }}

      # ============================================
      # Common: Logs and Artifacts
      # ============================================
      - name: Prepare suite logs
        if: always()
        env:
          QUITOQUE_USERNAME: ${{ secrets.QUITOQUE_USERNAME }}
          QUITOQUE_PASSWORD: ${{ secrets.QUITOQUE_PASSWORD }}
        run: |
          bash .github/scripts/prepare-maestro-logs.sh maestro_logs_${{ matrix.suite }}
          bash .github/scripts/redact-maestro-secrets.sh report.xml

      # Secret masking covers the log stream, not files inside an artifact.
      - name: Scan suite logs for credentials
        id: secret-scan
        if: always()
        env:
          QUITOQUE_USERNAME: ${{ secrets.QUITOQUE_USERNAME }}
          QUITOQUE_PASSWORD: ${{ secrets.QUITOQUE_PASSWORD }}
        run: bash .github/scripts/check-artifact-secrets.sh maestro_logs_${{ matrix.suite }} report.xml

      - name: Upload test suite logs
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: maestro-logs-${{ inputs.platform }}-${{ matrix.suite }}.zip
          path: maestro_logs_${{ matrix.suite }}/
          retention-days: 1

      - name: Upload JUnit report for suite
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: junit-e2e-${{ inputs.platform }}-${{ matrix.suite }}
          path: report.xml
          retention-days: 1
