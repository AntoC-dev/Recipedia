name: 📚 Documentation
description: Documentation is wrong, missing, outdated or unclear
labels: ["documentation"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate
          required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: File path, URL or section name
      placeholder: guides/ocr.md, "Setup" section
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong, missing or unclear, and what should it say instead?
    validations:
      required: true
