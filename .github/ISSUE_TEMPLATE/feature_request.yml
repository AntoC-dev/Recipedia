name: ✨ Feature Request
description: Suggest a new feature or an improvement to an existing one
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: When I plan my week, I have to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Sketches or screenshots welcome.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today or other approaches you thought of.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Home / recommendations
        - Recipe view
        - Recipe creation / editing
        - Recipe import from URL
        - Bulk import
        - Recipe scan (OCR / photo)
        - Search and filters
        - Menu
        - Shopping list
        - Parameters (ingredients, tags, preferences)
        - Tutorial / onboarding
        - Accessibility
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
