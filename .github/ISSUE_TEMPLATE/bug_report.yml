name: 🐛 Bug Report
description: Something in Recipedia is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer a private report? Use **Parameters → About → Report a bug** in the app: it emails logs to the maintainer.
        Issues here are public: don't paste personal data, credentials or login-bound recipe URLs.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. Add screenshots or a screen recording if it helps.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Search tab
        2. Tap on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Home / recommendations
        - Recipe view
        - Recipe creation / editing
        - Recipe import from URL
        - Bulk import
        - Recipe scan (OCR / photo)
        - Search and filters
        - Menu
        - Shopping list
        - Parameters (ingredients, tags, preferences)
        - Tutorial / onboarding
        - Other
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - App crashes, shows "Something went wrong", or data is lost
        - A feature does not work
        - Minor or cosmetic issue
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Always
        - Often
        - Sometimes
        - Only once

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Both
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: iPhone 13, iOS 18.2
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Parameters → About → Version
      placeholder: 2.53.0
    validations:
      required: true

  - type: input
    id: recipe-url
    attributes:
      label: Recipe URL
      description: For import issues. Public pages only; never include login, session or tokenized links.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Logs, anything else relevant.
