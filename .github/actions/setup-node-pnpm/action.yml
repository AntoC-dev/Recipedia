name: 'Setup Node and pnpm'
description: 'Install pnpm (version from packageManager) and Node.js, optionally caching the pnpm store'
inputs:
  cache:
    description: "Set to 'pnpm' to cache the pnpm store (jobs that run pnpm install)"
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: ${{ inputs.cache }}
