name: 'Setup iOS Build Environment'
description: 'Setup Python, EAS, ccache, and Expo caching for iOS builds'

inputs:
  expo-token:
    description: 'Expo token for EAS'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Python for recipe-scraper module
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    # eas --local requires an empty working dir; a fixed one keeps ccache paths stable
    - name: Setup ccache
      shell: bash
      run: |
        HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache
        # RN's ccache-clang.sh runs `$CCACHE_BINARY clang`, but Xcode doesn't export CCACHE_BINARY to
        # compiler calls: put ccache's clang shim first on PATH so plain `clang` still goes through ccache
        echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"
        {
          echo "EAS_LOCAL_BUILD_WORKINGDIR=${{ runner.temp }}/eas-build"
          echo "USE_CCACHE=1"
          # ccache: RN's compiler wrapper path is built on PODS_ROOT, which app extensions (expo-sharing)
          # lack. Env is the lowest-precedence build setting, so only they pick this up.
          # https://github.com/EvanBacon/expo-apple-targets/issues/118
          echo 'PODS_ROOT=$(SRCROOT)/Pods'
          echo "CCACHE_DIR=$HOME/Library/Caches/ccache"
          echo "CCACHE_BASEDIR=${{ runner.temp }}/eas-build"
          # /usr/bin/clang is an xcrun trampoline: hash the real toolchain's version, not its content
          echo "CCACHE_COMPILERCHECK=%compiler% -v"
          echo "CCACHE_MAXSIZE=2G"
        } >> "$GITHUB_ENV"

    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/ccache
        key: ${{ runner.os }}-ccache-ios-${{ hashFiles('package-lock.json', 'modules/**', 'plugins/**') }}
        restore-keys: |
          ${{ runner.os }}-ccache-ios-

    - name: Cache global Expo artifacts
      uses: actions/cache@v6
      with:
        path: ~/.expo
        key: ${{ runner.os }}-expo-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-expo-

    - name: Setup EAS
      uses: expo/expo-github-action@v9
      with:
        eas-version: 24.12.1
        packager: 'npm'
        token: ${{ inputs.expo-token }}
