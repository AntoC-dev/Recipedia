name: 'Setup Android Build Environment'
description: 'Setup Java, Android SDK, Gradle caching, ccache, Expo caching, and EAS for Android builds (Python/Chaquopy set up by the caller)'

inputs:
  expo-token:
    description: 'Expo token for EAS'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # eas --local requires an empty working dir; a fixed one keeps ccache paths stable.
    # NDK CMake calls clang by absolute path, so ccache goes in as compiler launcher.
    - name: Setup ccache
      shell: bash
      run: |
        sudo apt-get install -y ccache
        {
          echo "EAS_LOCAL_BUILD_WORKINGDIR=${{ runner.temp }}/eas-build"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          echo "CCACHE_DIR=$HOME/.ccache"
          echo "CCACHE_BASEDIR=${{ runner.temp }}/eas-build"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime,time_macros"
          echo "CCACHE_MAXSIZE=2G"
        } >> "$GITHUB_ENV"

    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-android-${{ hashFiles('package-lock.json', 'modules/**', 'plugins/**') }}
        restore-keys: |
          ${{ runner.os }}-ccache-android-

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Setup Gradle with caching
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: false
        build-scan-publish: false

    - name: Cache global Expo artifacts
      uses: actions/cache@v6
      with:
        path: ~/.expo
        key: ${{ runner.os }}-expo-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-expo-

    - name: Use project-pinned EAS CLI
      shell: bash
      run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Setup EAS
      uses: expo/expo-github-action@v9
      with:
        packager: 'npm'
        token: ${{ inputs.expo-token }}
