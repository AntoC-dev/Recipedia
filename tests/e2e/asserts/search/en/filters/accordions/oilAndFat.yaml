appId: "com.recipedia"
---
# Route by STATE to the shared accordion asserts for the Oil and Fat category.
- runFlow:
    when:
      true: ${STATE == "filtered"}
    file: "accordionFiltered.yaml"
    env:
      CATEGORY: "Oil and Fat"
      ITEM_NAMES: "Butter,Olive Oil"
      ITEM_COUNT: "2"
      VISIBLE_ITEMS: ${VISIBLE_ITEMS}

- runFlow:
    when:
      true: ${STATE == "hidden"}
    file: "accordionHidden.yaml"
    env:
      CATEGORY: "Oil and Fat"

- runFlow:
    when:
      true: ${STATE == "all"}
    file: "accordionAll.yaml"
    env:
      CATEGORY: "Oil and Fat"
      ITEM_COUNT: "2"
