appId: "com.recipedia"
---
# Route by STATE to the shared accordion asserts for the Tags category.
- runFlow:
    when:
      true: ${STATE == "filtered"}
    file: "accordionFiltered.yaml"
    env:
      CATEGORY: "Tags"
      ITEM_NAMES: "Breakfast,Chocolate,Dessert,Dinner,Healthy,Indian,Italian,Japanese,Lunch,Mexican,Quick Meal,Salad,Seafood,Soup,Vegetarian"
      ITEM_COUNT: "15"
      VISIBLE_ITEMS: ${VISIBLE_ITEMS}

- runFlow:
    when:
      true: ${STATE == "hidden"}
    file: "accordionHidden.yaml"
    env:
      CATEGORY: "Tags"

- runFlow:
    when:
      true: ${STATE == "all"}
    file: "accordionAll.yaml"
    env:
      CATEGORY: "Tags"
      ITEM_COUNT: "15"
