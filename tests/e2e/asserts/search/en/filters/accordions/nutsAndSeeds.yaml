appId: "com.recipedia"
---
# Route by STATE to the shared accordion asserts for the Nuts and Seeds category.
- runFlow:
    when:
      true: ${STATE == "filtered"}
    file: "accordionFiltered.yaml"
    env:
      CATEGORY: "Nuts and Seeds"
      ITEM_NAMES: "Pine Nuts"
      ITEM_COUNT: "1"
      VISIBLE_ITEMS: ${VISIBLE_ITEMS}

- runFlow:
    when:
      true: ${STATE == "hidden"}
    file: "accordionHidden.yaml"
    env:
      CATEGORY: "Nuts and Seeds"

- runFlow:
    when:
      true: ${STATE == "all"}
    file: "accordionAll.yaml"
    env:
      CATEGORY: "Nuts and Seeds"
      ITEM_COUNT: "1"
