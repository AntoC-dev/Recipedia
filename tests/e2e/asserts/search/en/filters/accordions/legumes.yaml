appId: "com.recipedia"
---
# Route by STATE to the shared accordion asserts for the Legumes category.
- runFlow:
    when:
      true: ${STATE == "filtered"}
    file: "accordionFiltered.yaml"
    env:
      CATEGORY: "Legumes"
      ITEM_NAMES: "Red Lentils"
      ITEM_COUNT: "1"
      VISIBLE_ITEMS: ${VISIBLE_ITEMS}

- runFlow:
    when:
      true: ${STATE == "hidden"}
    file: "accordionHidden.yaml"
    env:
      CATEGORY: "Legumes"

- runFlow:
    when:
      true: ${STATE == "all"}
    file: "accordionAll.yaml"
    env:
      CATEGORY: "Legumes"
      ITEM_COUNT: "1"
