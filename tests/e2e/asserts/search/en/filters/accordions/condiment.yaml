appId: "com.recipedia"
---
# Route by STATE to the shared accordion asserts for the Condiment category.
- runFlow:
    when:
      true: ${STATE == "filtered"}
    file: "accordionFiltered.yaml"
    env:
      CATEGORY: "Condiment"
      ITEM_NAMES: "Nori Sheets,Soy Sauce"
      ITEM_COUNT: "2"
      VISIBLE_ITEMS: ${VISIBLE_ITEMS}

- runFlow:
    when:
      true: ${STATE == "hidden"}
    file: "accordionHidden.yaml"
    env:
      CATEGORY: "Condiment"

- runFlow:
    when:
      true: ${STATE == "all"}
    file: "accordionAll.yaml"
    env:
      CATEGORY: "Condiment"
      ITEM_COUNT: "2"
