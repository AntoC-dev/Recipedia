appId: "com.recipedia"
---
# Route by STATE to the shared accordion asserts for the Only in-season ingredients category.
- runFlow:
    when:
      true: ${STATE == "filtered"}
    file: "accordionFiltered.yaml"
    env:
      CATEGORY: "Only in-season ingredients"
      ITEM_NAMES: "Only in-season ingredients"
      ITEM_COUNT: "1"
      VISIBLE_ITEMS: ${VISIBLE_ITEMS}

- runFlow:
    when:
      true: ${STATE == "hidden"}
    file: "accordionHidden.yaml"
    env:
      CATEGORY: "Only in-season ingredients"

- runFlow:
    when:
      true: ${STATE == "all"}
    file: "accordionAll.yaml"
    env:
      CATEGORY: "Only in-season ingredients"
      ITEM_COUNT: "1"
