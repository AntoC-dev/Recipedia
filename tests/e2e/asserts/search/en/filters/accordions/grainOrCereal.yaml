appId: "com.recipedia"
---
# Route by STATE to the shared accordion asserts for the Cereal category.
- runFlow:
    when:
      true: ${STATE == "filtered"}
    file: "accordionFiltered.yaml"
    env:
      CATEGORY: "Cereal"
      ITEM_NAMES: "Spaghetti,Taco Shells,Croutons,Pizza Dough,Pasta,Sushi Rice"
      ITEM_COUNT: "6"
      VISIBLE_ITEMS: ${VISIBLE_ITEMS}

- runFlow:
    when:
      true: ${STATE == "hidden"}
    file: "accordionHidden.yaml"
    env:
      CATEGORY: "Cereal"

- runFlow:
    when:
      true: ${STATE == "all"}
    file: "accordionAll.yaml"
    env:
      CATEGORY: "Cereal"
      ITEM_COUNT: "6"
