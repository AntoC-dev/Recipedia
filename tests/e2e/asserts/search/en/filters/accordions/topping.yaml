appId: "com.recipedia"
---
# Route by STATE to the shared accordion asserts for the Topping category.
- runFlow:
    when:
      true: ${STATE == "hidden"}
    file: "accordionHidden.yaml"
    env:
      CATEGORY: "Topping"

- runFlow:
    when:
      true: ${STATE == "all"}
    file: "accordionAll.yaml"
    env:
      CATEGORY: "Topping"
      ITEM_COUNT: "1"
