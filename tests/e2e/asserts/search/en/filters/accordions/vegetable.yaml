appId: "com.recipedia"
---
# Route by STATE to the shared accordion asserts for the Vegetable category.
- runFlow:
    when:
      true: ${STATE == "filtered"}
    file: "accordionFiltered.yaml"
    env:
      CATEGORY: "Vegetable"
      ITEM_NAMES: "Lettuce,Romaine Lettuce,Carrots,Celery,Potatoes,Onions,Tomatoes"
      ITEM_COUNT: "7"
      VISIBLE_ITEMS: ${VISIBLE_ITEMS}

- runFlow:
    when:
      true: ${STATE == "hidden"}
    file: "accordionHidden.yaml"
    env:
      CATEGORY: "Vegetable"

- runFlow:
    when:
      true: ${STATE == "all"}
    file: "accordionAll.yaml"
    env:
      CATEGORY: "Vegetable"
      ITEM_COUNT: "7"
