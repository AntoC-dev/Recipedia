appId: "com.recipedia"
---
# Route by STATE to the shared accordion asserts for the Cheese category.
- runFlow:
    when:
      true: ${STATE == "filtered"}
    file: "accordionFiltered.yaml"
    env:
      CATEGORY: "Cheese"
      ITEM_NAMES: "Cheddar Cheese,Mozzarella Cheese,Parmesan Cheese"
      ITEM_COUNT: "3"
      VISIBLE_ITEMS: ${VISIBLE_ITEMS}

- runFlow:
    when:
      true: ${STATE == "hidden"}
    file: "accordionHidden.yaml"
    env:
      CATEGORY: "Cheese"

- runFlow:
    when:
      true: ${STATE == "all"}
    file: "accordionAll.yaml"
    env:
      CATEGORY: "Cheese"
      ITEM_COUNT: "3"
