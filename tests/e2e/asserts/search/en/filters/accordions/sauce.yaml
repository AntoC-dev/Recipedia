appId: "com.recipedia"
---
# Route by STATE to the shared accordion asserts for the Sauce category.
- runFlow:
    when:
      true: ${STATE == "filtered"}
    file: "accordionFiltered.yaml"
    env:
      CATEGORY: "Sauce"
      ITEM_NAMES: "Caesar Dressing,Coconut Milk,Tomato Sauce,Vegetable Broth"
      ITEM_COUNT: "4"
      VISIBLE_ITEMS: ${VISIBLE_ITEMS}

- runFlow:
    when:
      true: ${STATE == "hidden"}
    file: "accordionHidden.yaml"
    env:
      CATEGORY: "Sauce"

- runFlow:
    when:
      true: ${STATE == "all"}
    file: "accordionAll.yaml"
    env:
      CATEGORY: "Sauce"
      ITEM_COUNT: "4"
