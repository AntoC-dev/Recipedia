appId: "com.recipedia"
---
# Route by STATE to the shared accordion asserts for the Spice category.
- runFlow:
    when:
      true: ${STATE == "filtered"}
    file: "accordionFiltered.yaml"
    env:
      CATEGORY: "Spice"
      ITEM_NAMES: "Basil Leaves,Cocoa Powder,Curry Powder"
      ITEM_COUNT: "3"
      VISIBLE_ITEMS: ${VISIBLE_ITEMS}

- runFlow:
    when:
      true: ${STATE == "hidden"}
    file: "accordionHidden.yaml"
    env:
      CATEGORY: "Spice"

- runFlow:
    when:
      true: ${STATE == "all"}
    file: "accordionAll.yaml"
    env:
      CATEGORY: "Spice"
      ITEM_COUNT: "3"
