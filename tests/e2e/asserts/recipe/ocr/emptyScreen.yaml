appId: "com.recipedia"
---
- runFlow:
    file: "../common/buttonsOCREmpty.yaml"
    label: "Assert common OCR buttons and image (empty state)"

- assertVisible:
    id: "RecipeTitle::Text"
    text: "Title:"
    label: "Intro text for the title is rendered"

- assertVisible:
    id: "RecipeTitle::OpenModal::RoundButton"
    label: "OCR button for the title is rendered"

- assertVisible:
    id: "RecipeTitle::OpenModal::RoundButton::Label"
    text: "Scan"
    label: "OCR button label for the title is rendered"

- assertVisible:
    id: "RecipeDescription::Text"
    text: "Description:"
    label: "Intro text for the description is rendered"

- assertVisible:
    id: "RecipeDescription::OpenModal::RoundButton"
    label: "OCR button for the description is rendered"

- assertVisible:
    id: "RecipeDescription::OpenModal::RoundButton::Label"
    text: "Scan"
    label: "OCR button label for the description is rendered"

- scrollUntilVisible:
    element:
      id: "RecipeTags::HeaderText"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll down to the tags section"

- assertVisible:
    id: "RecipeTags::HeaderText"
    text: "Tags:"
    label: "Intro text for the tags is rendered"

- scrollUntilVisible:
    element:
      id: "RecipeTags::ElementText"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll down to the tags element"

- assertVisible:
    id: "RecipeTags::ElementText"
    text: "Tags are a way to identify a recipe and make easier its search.\nHere are some examples of tags you can have : .*, .*, .*"
    label: "Explanation text for the tags is rendered"

- scrollUntilVisible:
    element:
      id: "RecipeTags::OpenModal::RoundButton"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll down to the tags open modal button"

- assertVisible:
    id: "RecipeTags::OpenModal::RoundButton"
    label: "OCR button for the tags is rendered"

- assertVisible:
    id: "RecipeTags::OpenModal::RoundButton::Label"
    text: "Scan"
    label: "OCR button label for the tags is rendered"

- assertVisible:
    id: "RecipeTags::RoundButton"
    label: "Add button for the tag is rendered"

- assertVisible:
    id: "RecipeTags::RoundButton::Label"
    text: "New tag"
    label: "Add button label for the tag is rendered"

- scrollUntilVisible:
    element:
      id: "RecipePersons::NumericTextInput"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll down to the number of persons part"

- assertVisible:
    id: "RecipePersons::PrefixText"
    text: "This recipe is for : "
    label: "Intro text for the number of persons is rendered"

- assertVisible:
    id: "RecipePersons::NumericTextInput"
    text: "4"
    label: "Number of persons is rendered"

- assertVisible:
    id: "RecipePersons::SuffixText"
    text: " persons"
    label: "Outro text for the number of persons is rendered"

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::OpenModalNames::RoundButton"
    direction: DOWN
    speed: 20
    centerElement: true

- assertVisible:
    id: "RecipeIngredients::PrefixText"
    text: "Ingredients: "
    label: "Section Ingredients is rendered"

- assertVisible:
    id: "RecipeIngredients::OpenModalNames::RoundButton"
    label: "OCR button for the ingredients is rendered"

- assertVisible:
    id: "RecipeIngredients::OpenModalNames::RoundButton::Label"
    text: "Scan names"
    label: "Scan names button label is rendered"

- assertVisible:
    id: "RecipeIngredients::AddButton::RoundButton"
    label: "OCR button for manually adding the ingredients is rendered"

- assertVisible:
    id: "RecipeIngredients::AddButton::RoundButton::Label"
    text: "Add manually"
    label: "Add manually button label is rendered"

- scrollUntilVisible:
    element:
      id: "RecipeTime::OpenModal::RoundButton"
    direction: DOWN
    speed: 20
    centerElement: true

- assertVisible:
    id: "RecipeTime::PrefixText"
    text: "Prep time (minutes):"
    label: "Intro text for the time to prepare is rendered"

- assertVisible:
    id: "RecipeTime::OpenModal::RoundButton"
    label: "OCR button for the time is rendered"

- assertVisible:
    id: "RecipeTime::OpenModal::RoundButton::Label"
    text: "Scan"
    label: "OCR button label for the time is rendered"

- assertVisible:
    id: "RecipeTime::ManuallyFill::RoundButton::Label"
    text: "Add manually"
    label: "Manual fill button label for the time is rendered"

- scrollUntilVisible:
    element:
      id: "RecipePreparation::OpenModal::RoundButton"
    direction: DOWN
    speed: 20
    centerElement: true

- assertVisible:
    id: "RecipePreparation::PrefixText"
    text: "Preparation :"
    label: "Section Preparation is rendered"

- assertVisible:
    id: "RecipePreparation::OpenModal::RoundButton"
    label: "OCR button for the preparation is rendered"

- assertVisible:
    id: "RecipePreparation::OpenModal::RoundButton::Label"
    text: "Scan"
    label: "OCR button label for the preparation is rendered"

- assertVisible:
    id: "RecipePreparation::AddButton::RoundButton::Label"
    text: "Add manually"
    label: "Manual add button label for the preparation is rendered"

- runFlow:
    file: "../common/nutritionEmptyOCR.yaml"
    label: "Verify nutrition section is empty with OCR scan button"

- scrollUntilVisible:
    element:
      id: "RecipeImage"
    direction: UP
    speed: 20
    timeout: 120000
    centerElement: true
    label: "Scroll back to top"

- waitForAnimationToEnd
