appId: "com.recipedia"
---

- waitForAnimationToEnd

- runFlow:
    file: "../../../flows/scrollToEndTarget.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionEmptyState::OCRButton::RoundButton"
    label: "Scroll to empty nutrition section"

- waitForAnimationToEnd

- assertVisible:
    id: "Recipe::RecipeNutrition::NutritionEmptyState::Title"
    text: "Nutritional values:"
    label: "Nutrition title is displayed (empty state)"

- assertVisible:
    id: "Recipe::RecipeNutrition::NutritionEmptyState::OCRButton::RoundButton"
    label: "OCR scan button for nutrition is displayed"

- assertVisible:
    id: "Recipe::RecipeNutrition::NutritionEmptyState::OCRButton::RoundButton::Label"
    text: "Scan"
    label: "OCR scan button label for nutrition is displayed"
