appId: "com.recipedia"
---
- assertVisible:
    id: "Recipe::AppBar::BackButton"
    text: "Back"
    label: "Back button is displayed"

- assertVisible:
    id: "Recipe::BottomActionButton-text"
    text: "Add this new recipe"
    label: "Add recipe button is displayed"

- assertVisible:
    id: "RecipeImage::RoundButton-content"
    label: "Image button is rendered"

- assertVisible:
    id: "RecipeImage::RoundButton::Label"
    text: "Photo"
    label: "Image button label is rendered"

- assertNotVisible:
    id: "RecipeImage::Placeholder"
    label: "Placeholder icon is hidden behind the image button"

- assertVisible:
    id: "RecipeImage"
    label: "Image container is displayed"
