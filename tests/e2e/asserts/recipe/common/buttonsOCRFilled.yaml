appId: "com.recipedia"
---
- runFlow:
    file: "buttonsFilledCommon.yaml"
    label: "Assert common filled buttons"

- assertVisible:
    id: "RecipeImage::RoundButton"
    label: "OCR image button is rendered"

- assertNotVisible:
    id: "RecipeImage::RoundButton::Label"
    label: "OCR image button label is hidden over the loaded picture"

