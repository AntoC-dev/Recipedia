appId: "com.recipedia"
---
- assertVisible:
    id: "RecipeTitle::Text"
    text: "Title:"
    label: "Title label is rendered"

- assertVisible:
    id: "RecipeTitle::CustomTextInput"
    text: "Test Recipe"
    label: "Title input shows 'Test Recipe'"

- scrollUntilVisible:
    element:
      id: "RecipePersons::PrefixText"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll to persons section"

- assertVisible:
    id: "RecipePersons::PrefixText"
    text: "Servings:"
    label: "Intro text for the number of persons is rendered"

- scrollUntilVisible:
    element:
      id: "RecipePersons::NumericTextInput"
    direction: UP
    speed: 20
    centerElement: true
    label: "Scroll to ensure persons's text input is visible"

- assertVisible:
    id: "RecipePersons::NumericTextInput"
    text: "2"
    label: "Number of persons is 2"

- assertVisible:
    id: "RecipePersons::SuffixText"
    text: "persons"
    label: "Outro text for the number of persons is rendered"

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::PrefixText"
    direction: DOWN
    speed: 20
    centerElement: true

- assertVisible:
    id: "RecipeIngredients::PrefixText"
    text: "Ingredients: "
    label: "Section Ingredients is rendered"

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::1::QuantityInput"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll to end of ingredients section"

- assertVisible:
    id: "RecipeIngredients::0::QuantityInput"
    text: "200"
    label: "Pasta quantity is 200"

- assertVisible:
    id: "RecipeIngredients::0::NameInput::CustomTextInput"
    text: "Pasta"
    label: "First ingredient is Pasta"

- assertVisible:
    id: "RecipeIngredients::0::ActionsButton"
    label: "Actions button of Pasta is visible"
- tapOn:
    id: "RecipeIngredients::0::ActionsButton"
    label: "Open the actions menu of Pasta"
- assertVisible:
    id: "RecipeIngredients::0::MoveUpItem"
    enabled: false
    label: "Move up item of Pasta is disabled on the first ingredient"
- assertVisible:
    id: "RecipeIngredients::0::MoveUpItem-title"
    text: "Move up"
    label: "Move up item of Pasta is labelled Move up"
- assertVisible:
    id: "RecipeIngredients::0::MoveDownItem"
    enabled: true
    label: "Move down item of Pasta is enabled"
- assertVisible:
    id: "RecipeIngredients::0::MoveDownItem-title"
    text: "Move down"
    label: "Move down item of Pasta is labelled Move down"
- assertVisible:
    id: "RecipeIngredients::0::DeleteItem"
    enabled: true
    label: "Delete item of Pasta is enabled"
- assertVisible:
    id: "RecipeIngredients::0::DeleteItem-title"
    text: "Delete"
    label: "Delete item of Pasta is labelled Delete"
- runFlow:
    file: "../../../flows/recipe/ingredients/dismissIngredientActionsMenu.yaml"
    env:
      INDEX: "0"
    label: "Dismiss the actions menu of Pasta"

- assertVisible:
    id: "RecipeIngredients::1::QuantityInput"
    text: "100"
    label: "Tomatoes quantity is 100"

- assertVisible:
    id: "RecipeIngredients::1::NameInput::CustomTextInput"
    text: "Tomatoes"
    label: "Second ingredient is Tomatoes"

- assertVisible:
    id: "RecipeIngredients::1::ActionsButton"
    label: "Actions button of Tomatoes is visible"
- tapOn:
    id: "RecipeIngredients::1::ActionsButton"
    label: "Open the actions menu of Tomatoes"
- assertVisible:
    id: "RecipeIngredients::1::MoveUpItem"
    enabled: true
    label: "Move up item of Tomatoes is enabled"
- assertVisible:
    id: "RecipeIngredients::1::MoveDownItem"
    enabled: false
    label: "Move down item of Tomatoes is disabled on the last ingredient"
- assertVisible:
    id: "RecipeIngredients::1::DeleteItem"
    enabled: true
    label: "Delete item of Tomatoes is enabled"
- runFlow:
    file: "../../../flows/recipe/ingredients/dismissIngredientActionsMenu.yaml"
    env:
      INDEX: "1"
    label: "Dismiss the actions menu of Tomatoes"
