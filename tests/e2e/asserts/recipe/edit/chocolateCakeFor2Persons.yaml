appId: "com.recipedia"
---
- assertVisible:
    id: "RecipeTitle::CustomTextInput"
    text: "Chocolate Cake"
    label: "Title input shows 'Chocolate Cake'"

- scrollUntilVisible:
    element:
      id: "RecipePersons::PrefixText"
    direction: DOWN
    speed: 20
    timeout: 60000
    centerElement: true
    label: "Scroll to Number of persons input"

- assertVisible:
    id: "RecipePersons::NumericTextInput"
    text: "2"
    label: "Number of persons is 2"

- assertVisible:
    id: "RecipePersons::SuffixText"
    text: "persons"
    label: "Outro text for the number of persons is rendered"

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::PrefixText"
    direction: DOWN
    speed: 20
    centerElement: true

- assertVisible:
    id: "RecipeIngredients::PrefixText"
    text: "Ingredients: "
    label: "Section Ingredients is rendered"

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::0::QuantityInput"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll to Flour ingredient"

- assertVisible:
    id: "RecipeIngredients::0::QuantityInput"
    text: "66[.]67"
    label: "Flour quantity is scaled to 66.67g"

- assertVisible:
    id: "RecipeIngredients::0::NameInput::CustomTextInput"
    text: "Flour"
    label: "First ingredient is Flour"

- assertVisible:
    id: "RecipeIngredients::0::ActionsButton"
    label: "Actions button of Flour is visible"
- tapOn:
    id: "RecipeIngredients::0::ActionsButton"
    label: "Open the actions menu of Flour"
- assertVisible:
    id: "RecipeIngredients::0::MoveUpItem"
    enabled: false
    label: "Move up item of Flour is disabled on the first ingredient"
- assertVisible:
    id: "RecipeIngredients::0::MoveUpItem-title"
    text: "Move up"
    label: "Move up item of Flour is labelled Move up"
- assertVisible:
    id: "RecipeIngredients::0::MoveDownItem"
    enabled: true
    label: "Move down item of Flour is enabled"
- assertVisible:
    id: "RecipeIngredients::0::MoveDownItem-title"
    text: "Move down"
    label: "Move down item of Flour is labelled Move down"
- assertVisible:
    id: "RecipeIngredients::0::DeleteItem"
    enabled: true
    label: "Delete item of Flour is enabled"
- assertVisible:
    id: "RecipeIngredients::0::DeleteItem-title"
    text: "Delete"
    label: "Delete item of Flour is labelled Delete"
- runFlow:
    file: "../../../flows/recipe/ingredients/dismissIngredientActionsMenu.yaml"
    env:
      INDEX: "0"
    label: "Dismiss the actions menu of Flour"

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::1::QuantityInput"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll to Cocoa Powder ingredient"

- assertVisible:
    id: "RecipeIngredients::1::QuantityInput"
    text: "16[.]67"
    label: "Cocoa Powder quantity is scaled to 16.67g"

- assertVisible:
    id: "RecipeIngredients::1::NameInput::CustomTextInput"
    text: "Cocoa Powder"
    label: "Second ingredient is Cocoa Powder"

- assertVisible:
    id: "RecipeIngredients::1::ActionsButton"
    label: "Actions button of Cocoa Powder is visible"
- tapOn:
    id: "RecipeIngredients::1::ActionsButton"
    label: "Open the actions menu of Cocoa Powder"
- assertVisible:
    id: "RecipeIngredients::1::MoveUpItem"
    enabled: true
    label: "Move up item of Cocoa Powder is enabled"
- assertVisible:
    id: "RecipeIngredients::1::MoveDownItem"
    enabled: true
    label: "Move down item of Cocoa Powder is enabled"
- assertVisible:
    id: "RecipeIngredients::1::DeleteItem"
    enabled: true
    label: "Delete item of Cocoa Powder is enabled"
- runFlow:
    file: "../../../flows/recipe/ingredients/dismissIngredientActionsMenu.yaml"
    env:
      INDEX: "1"
    label: "Dismiss the actions menu of Cocoa Powder"

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::2::QuantityInput"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll to Sugar ingredient"

- assertVisible:
    id: "RecipeIngredients::2::QuantityInput"
    text: "50"
    label: "Sugar quantity is scaled to 50g"

- assertVisible:
    id: "RecipeIngredients::2::NameInput::CustomTextInput"
    text: "Sugar"
    label: "Third ingredient is Sugar"

- assertVisible:
    id: "RecipeIngredients::2::ActionsButton"
    label: "Actions button of Sugar is visible"
- tapOn:
    id: "RecipeIngredients::2::ActionsButton"
    label: "Open the actions menu of Sugar"
- assertVisible:
    id: "RecipeIngredients::2::MoveUpItem"
    enabled: true
    label: "Move up item of Sugar is enabled"
- assertVisible:
    id: "RecipeIngredients::2::MoveDownItem"
    enabled: true
    label: "Move down item of Sugar is enabled"
- assertVisible:
    id: "RecipeIngredients::2::DeleteItem"
    enabled: true
    label: "Delete item of Sugar is enabled"
- runFlow:
    file: "../../../flows/recipe/ingredients/dismissIngredientActionsMenu.yaml"
    env:
      INDEX: "2"
    label: "Dismiss the actions menu of Sugar"

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::3::QuantityInput"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll to Butter ingredient"

- assertVisible:
    id: "RecipeIngredients::3::QuantityInput"
    text: "33[.]33"
    label: "Butter quantity is scaled to 33.33g"

- assertVisible:
    id: "RecipeIngredients::3::NameInput::CustomTextInput"
    text: "Butter"
    label: "Fourth ingredient is Butter"

- assertVisible:
    id: "RecipeIngredients::3::ActionsButton"
    label: "Actions button of Butter is visible"
- tapOn:
    id: "RecipeIngredients::3::ActionsButton"
    label: "Open the actions menu of Butter"
- assertVisible:
    id: "RecipeIngredients::3::MoveUpItem"
    enabled: true
    label: "Move up item of Butter is enabled"
- assertVisible:
    id: "RecipeIngredients::3::MoveDownItem"
    enabled: false
    label: "Move down item of Butter is disabled on the last ingredient"
- assertVisible:
    id: "RecipeIngredients::3::DeleteItem"
    enabled: true
    label: "Delete item of Butter is enabled"
- runFlow:
    file: "../../../flows/recipe/ingredients/dismissIngredientActionsMenu.yaml"
    env:
      INDEX: "3"
    label: "Dismiss the actions menu of Butter"
