name: "6 - Recipe Create Preparation Step Validation Flow"
appId: "com.recipedia"
tags:
  - recipe-create
---
- runFlow:
    file: "../../flows/recipe/adding/manual/en/openAddManually.yaml"
    label: "Action - Open manual recipe adding screen"

- runFlow:
    file: "../../flows/recipe/adding/en/addRecipeImage.yaml"
    label: "Action - Add recipe image"

- runFlow:
    file: "../../flows/recipe/addRow.yaml"
    env:
      SECTION: "RecipeIngredients"
    label: "Action - Add the ingredient row"

- scrollUntilVisible:
    element:
      id: "RecipeTitle::CustomTextInput"
    speed: 20
    direction: UP
    centerElement: true
    label: "Scroll to RecipeTitle::CustomTextInput"

- waitForAnimationToEnd

- runFlow:
    file: "../../flows/focusField.yaml"
    env:
      TARGET_ID: "RecipeTitle::CustomTextInput"
    label: "Action - Focus the title"

- runFlow:
    file: "../../flows/inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeTitle::CustomTextInput"
      VALUE: "Preparation Step Validation Test"
    label: "Action - Enter recipe title"

- runFlow:
    file: "../../flows/toolbarNext.yaml"
    label: "Action - Skip the description"

- runFlow:
    file: "../../flows/toolbarNext.yaml"
    label: "Action - Keep the default persons and move to the ingredient name"

- runFlow:
    file: "../../flows/inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::NameInput::CustomTextInput"
      VALUE: "Carrots"
    label: "Action - Add Carrots ingredient (exact DB match, no validation queue)"

- runFlow:
    file: "../../flows/inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::QuantityInput"
      VALUE: "100"
    label: "Action - Enter the Carrots quantity"

- runFlow:
    file: "../../flows/inputAndDone.yaml"
    env:
      TARGET_ID: "RecipeTime::NumericTextInput"
      VALUE: "30"
    label: "Action - Set preparation time"

- tapOn:
    id: "Recipe::BottomActionButton"
    label: "Action - Validate recipe before adding a preparation step"

- runFlow:
    file: "../../asserts/alerts/en/recipeValidationErrorSingle.yaml"
    env:
      MISSING_ELEMENT: "some instructions for the preparation"
    label: "Assert - Dialog reports preparation as the single missing element (no spurious extra fields from addNewPreparationStep auto-validation)"

- runFlow:
    file: "../../flows/recipe/addRow.yaml"
    env:
      SECTION: "RecipePreparation"
    label: "Action - Add an empty step (covers C8b: no premature errors on add)"

- scrollUntilVisible:
    element:
      id: "RecipePreparation::EditableStep::0::TextInputContent::CustomTextInput"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll to the step input, keyboard closed"

- waitForAnimationToEnd

- runFlow:
    file: "../../flows/focusField.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::0::TextInputContent::CustomTextInput"
    label: "Action - Focus the step content"

- runFlow:
    file: "../../flows/inputAndDone.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::0::TextInputContent::CustomTextInput"
      VALUE: "Cook for 10 minutes"
    label: "Action - Fill the step description (covers C5: typed value clears the missing-prep error)"

- assertVisible:
    id: "RecipePreparation::EditableStep::0::TextInputContent::CustomTextInput"
    text: "Cook for 10 minutes"
    label: "Assert - Check the step content once the keyboard is closed"

- tapOn:
    id: "Recipe::BottomActionButton"
    label: "Action - Validate recipe after the preparation step is filled"

- runFlow:
    file: "../../asserts/alerts/en/recipeAddedToDatabase.yaml"
    env:
      RECIPE_NAME: "Preparation Step Validation Test"
    label: "Assert - Recipe saved successfully (the typed description cleared the previous missing-prep error without a stale-state round-trip)"
