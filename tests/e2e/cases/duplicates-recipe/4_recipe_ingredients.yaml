name: "4 - Duplicate Recipe Ingredients Detection Flow"
appId: "com.recipedia"
tags:
  - duplicates
---
- runFlow:
    file: "../../flows/recipe/deleteRecipeBySearchIfExists.yaml"
    env:
      SEARCH_TEXT: "Test Recipe"
    label: "Cleanup - Remove any leftover Test Recipe from previous runs"

- runFlow:
    file: "../../flows/recipe/adding/createBaseRecipeForDuplicateTests.yaml"
    label: "Action - Create base recipe"

- runFlow:
    file: "../../asserts/alerts/en/recipeAddedToDatabase.yaml"
    env:
      RECIPE_NAME: ".*"
    label: "Assert - Verify recipe added to database"

- runFlow:
    file: "../../flows/recipe/verifyRecipeExistsInSearch.yaml"
    env:
      SEARCH_TEXT: "Test Recipe"
    label: "Verify - Confirm recipe is searchable before duplicate test"

- runFlow:
    file: "../../flows/recipe/adding/createBaseRecipeForDuplicateTests.yaml"
    label: "Action - Create identical recipe"

- runFlow:
    file: "../../asserts/alerts/en/recipeSimilarFound.yaml"
    label: "Assert - Verify duplicate alert appears"

- tapOn:
    id: "Recipe::Dialog::Cancel"
    label: "Action - Cancel adding duplicate recipe"

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::PrefixText"
    direction: UP
    speed: 20
    timeout: 60000
    centerElement: true
    label: "Action - Scroll up to ingredient section"

- waitForAnimationToEnd
- runFlow:
    file: "../../flows/recipe/addRow.yaml"
    env:
      SECTION: "RecipeIngredients"
    label: "Action - Add an ingredient row"

- runFlow:
    file: "../../flows/focusField.yaml"
    env:
      TARGET_ID: "RecipeIngredients::2::NameInput::CustomTextInput"
    label: "Action - Focus the Olive Oil name"

- runFlow:
    file: "../../flows/inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::2::NameInput::CustomTextInput"
      VALUE: "Olive Oil"
    label: "Action - Enter the Olive Oil name"

- runFlow:
    file: "../../flows/inputAndCommitText.yaml"
    env:
      TARGET_ID: "RecipeIngredients::2::QuantityInput"
      VALUE: "5"
      DISMISS_ID: "RecipeIngredients::2::Unit"
    label: "Action - Add Olive Oil ingredient"

- tapOn:
    id: "Recipe::BottomActionButton"
    label: "Action - Validate recipe with extra ingredient"

- runFlow:
    file: "../../asserts/alerts/en/recipeSimilarFound.yaml"
    label: "Assert - Verify duplicate alert appears (extra ingredient ignored)"

- tapOn:
    id: "Recipe::Dialog::Cancel"
    label: "Action - Cancel adding duplicate recipe"

- tapOn:
    id: "Recipe::AppBar::BackButton"
    label: "Action - Go back to home"

- runFlow:
    file: "../../flows/recipe/discardRecipeChanges.yaml"
    label: "Action - Confirm discarding the unsaved changes"

- runFlow:
    file: "../../flows/recipe/adding/manual/en/openAddManually.yaml"
    label: "Action - Open manual recipe creation"

- runFlow:
    file: "../../flows/recipe/adding/en/addRecipeImage.yaml"
    label: "Action - Add recipe image"

- runFlow:
    file: "../../flows/recipe/adding/createTwoIngredientRecipe.yaml"
    env:
      PERSONS: "2"
      ING0_NAME: "Chicken Breast"
      ING0_QTY: "300"
      ING1_NAME: "Sushi rice"
      ING1_QTY: "150"
      TIME: "20"
    label: "Action - Create recipe with different ingredients"

- tapOn:
    id: "Recipe::BottomActionButton"
    label: "Action - Validate the recipe"

- runFlow:
    file: "../../asserts/alerts/en/recipeAddedToDatabase.yaml"
    env:
      RECIPE_NAME: ".*"
    label: "Assert - Verify recipe added successfully (no duplicate)"
