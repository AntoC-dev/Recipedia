name: "3 - Duplicate Recipe Close Quantities Detection Flow"
appId: "com.recipedia"
tags:
  - duplicates
---
- runFlow:
    file: "../../flows/recipe/deleteRecipeBySearchIfExists.yaml"
    env:
      SEARCH_TEXT: "Test Recipe"
    label: "Cleanup - Remove any leftover Test Recipe from previous runs"

- runFlow:
    file: "../../flows/recipe/adding/createBaseRecipeForDuplicateTests.yaml"
    label: "Action - Create base recipe"

- runFlow:
    file: "../../asserts/alerts/en/recipeAddedToDatabase.yaml"
    env:
      RECIPE_NAME: ".*"
    label: "Assert - Verify recipe added to database"

- runFlow:
    file: "../../flows/recipe/verifyRecipeExistsInSearch.yaml"
    env:
      SEARCH_TEXT: "Test Recipe"
    label: "Verify - Confirm recipe is searchable before duplicate test"

- runFlow:
    file: "../../flows/recipe/adding/manual/en/openAddManually.yaml"
    label: "Action - Open manual recipe creation"

- runFlow:
    file: "../../flows/recipe/adding/en/addRecipeImage.yaml"
    label: "Action - Add recipe image"

- runFlow:
    file: "../../flows/recipe/adding/createTwoIngredientRecipe.yaml"
    env:
      PERSONS: "2"
      ING0_NAME: "Pasta"
      ING0_QTY: "201"
      ING1_NAME: "Tomatoes"
      ING1_QTY: "99"
      TIME: "15"
    label: "Action - Create recipe with close quantities"

- tapOn:
    id: "Recipe::BottomActionButton"
    label: "Action - Validate the recipe"

- runFlow:
    file: "../../asserts/alerts/en/recipeSimilarFound.yaml"
    label: "Assert - Verify close quantities duplicate alert appears"

- tapOn:
    id: "Recipe::Dialog::Cancel"
    label: "Action - Cancel adding duplicate recipe"

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::0::QuantityInput"
    direction: UP
    centerElement: true
    label: "Scroll to RecipeIngredients::0::QuantityInput"

- waitForAnimationToEnd

- runFlow:
    file: "../../flows/replaceAndDone.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::QuantityInput"
      VALUE: "260"
    label: "Action - Change Pasta to 260g (30% difference)"

- tapOn:
    id: "Recipe::BottomActionButton"
    label: "Action - Validate recipe with far quantities"

- runFlow:
    file: "../../asserts/alerts/en/recipeAddedToDatabase.yaml"
    env:
      RECIPE_NAME: ".*"
    label: "Assert - Verify recipe added successfully (no duplicate)"
