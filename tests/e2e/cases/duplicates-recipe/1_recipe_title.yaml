name: "1 - Duplicate Recipe Title Detection Flow"
appId: "com.recipedia"
tags:
  - duplicates
---
- runFlow:
    file: "../../flows/recipe/adding/createBaseRecipeForDuplicateTests.yaml"
    label: "Action - Create base recipe"

- runFlow:
    file: "../../asserts/alerts/en/recipeAddedToDatabase.yaml"
    env:
      RECIPE_NAME: ".*"
    label: "Assert - Verify recipe added to database"

- runFlow:
    file: "../../flows/recipe/adding/createBaseRecipeForDuplicateTests.yaml"
    label: "Action - Create identical recipe"

- runFlow:
    file: "../../asserts/alerts/en/recipeSimilarFound.yaml"
    label: "Assert - Verify duplicate alert appears"

- tapOn:
    id: "Recipe::Dialog::Cancel"
    label: "Action - Cancel adding duplicate recipe"

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "RecipeImage::Image"
    direction: UP
    speed: 95
    centerElement: true

- runFlow:
    file: "../../flows/replaceAndDone.yaml"
    env:
      TARGET_ID: "RecipeTitle::CustomTextInput"
      VALUE: "Test Recip"
    label: "Action - Replace RecipeTitle::CustomTextInput with Test Recip"

- assertVisible:
    id: "RecipeTitle::CustomTextInput"
    text: "Test Recip"
    label: "Assert - RecipeTitle::CustomTextInput still holds Test Recip once the keyboard is closed"

- tapOn:
    id: "Recipe::BottomActionButton"
    label: "Action - Validate recipe"

- runFlow:
    file: "../../asserts/alerts/en/recipeSimilarFound.yaml"
    label: "Assert - Verify fuzzy title duplicate alert appears"

- tapOn:
    id: "Recipe::Dialog::Cancel"
    label: "Action - Cancel adding duplicate recipe"

- runFlow:
    file: "../../flows/replaceAndDone.yaml"
    env:
      TARGET_ID: "RecipeTitle::CustomTextInput"
      VALUE: "Completely Different Recipe Name"
    label: "Action - Replace RecipeTitle::CustomTextInput with Completely Different Recipe Name"

- assertVisible:
    id: "RecipeTitle::CustomTextInput"
    text: "Completely Different Recipe Name"
    label: "Assert - RecipeTitle::CustomTextInput still holds Completely Different Recipe Name once the keyboard is closed"

- tapOn:
    id: "Recipe::BottomActionButton"
    label: "Action - Validate recipe with different title"

- runFlow:
    file: "../../asserts/alerts/en/recipeAddedToDatabase.yaml"
    env:
      RECIPE_NAME: ".*"
    label: "Assert - Verify recipe added successfully (no duplicate)"
