name: "1 - Back Gesture Tab Roots Flow"
appId: "com.recipedia"
tags:
  - back-gestures
---
- runFlow:
    file: "../../flows/navigation/backFromRootTab.yaml"
    env:
      TAB_ID: "BottomTabs::Search"
    label: "Action - Back from the Search tab"

- runFlow:
    file: "../../flows/navigation/backFromRootTab.yaml"
    env:
      TAB_ID: "BottomTabs::Menu"
    label: "Action - Back from the Menu tab"

- runFlow:
    file: "../../flows/navigation/backFromRootTab.yaml"
    env:
      TAB_ID: "BottomTabs::Shopping"
    label: "Action - Back from the Shopping tab"

- runFlow:
    file: "../../flows/navigation/backFromRootTab.yaml"
    env:
      TAB_ID: "BottomTabs::Parameters"
    label: "Action - Back from the Parameters tab"

- tapOn:
    id: "BottomTabs::Search"
    label: "Action - Navigate to Search tab"

- waitForAnimationToEnd

- runFlow:
    file: "../../flows/navigation/backFromRootTab.yaml"
    env:
      TAB_ID: "BottomTabs::Menu"
    label: "Action - Back after switching tabs"
