name: "3 - Duplicate Tag Exact Prevention Flow"
appId: "com.recipedia"
tags:
  - duplicates
---
- runFlow:
    file: "../../flows/fab/expand.yaml"
    label: "Action - Expand FAB menu"

# FAB ID uses regex pattern because React Native Paper adds suffix on iOS
- tapOn:
    id: "RecipeEdit.*"
    label: "Action - Open manual recipe creation"

- extendedWaitUntil:
    visible:
      id: "Recipe::AppBar"
    timeout: 30000
    label: "Wait for recipe screen to load"

- scrollUntilVisible:
    element:
      id: "RecipeTags::RoundButton"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Action - Scroll to tags section"

- tapOn:
    id: "RecipeTags::RoundButton"
    label: "Action - Add tag to recipe"

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "RecipeTags::List::0::CustomTextInput"
    speed: 20
    direction: DOWN
    centerElement: true
    label: "Scroll to RecipeTags::List::0::CustomTextInput"

- waitForAnimationToEnd

- runFlow:
    file: "../../flows/focusField.yaml"
    env:
      TARGET_ID: "RecipeTags::List::0::CustomTextInput"
    label: "Action - Focus on tag input field"

- runFlow:
    file: "../../flows/toolbarPrevious.yaml"
    label: "Action - Move back to the description with the toolbar Previous"

- assertVisible:
    id: "RecipeDescription::CustomTextInput"
    below:
      id: "Recipe::AppBar"
    label: "Assert - Description is visible below the app bar"

- runFlow:
    file: "../../flows/toolbarNext.yaml"
    label: "Action - Return to the tag input with the toolbar Next"

- assertVisible:
    id: "RecipeTags::List::0::CustomTextInput"
    below:
      id: "Recipe::AppBar"
    label: "Assert - Tag input is visible and stays below the app bar"

- runFlow:
    file: "../../flows/inputAndDone.yaml"
    env:
      TARGET_ID: "RecipeTags::List::0::CustomTextInput"
      VALUE: "Dessert"
    label: "Action - Enter existing tag name"

- scrollUntilVisible:
    element:
      id: "RecipeTags::0::Chip"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll to recipe tags"

- assertVisible:
    id: "RecipeTags::0::Chip"
    label: "Assert - Verify first tag added to recipe"

- assertVisible:
    text: "Dessert"
    label: "Assert - Verify Dessert tag appears"

- tapOn:
    id: "RecipeTags::RoundButton"
    label: "Action - Add tag to recipe again"

- runFlow:
    file: "../../flows/focusField.yaml"
    env:
      TARGET_ID: "RecipeTags::List::1::CustomTextInput"
    label: "Action - Focus on tag input field again"

- runFlow:
    file: "../../flows/inputAndDone.yaml"
    env:
      TARGET_ID: "RecipeTags::List::1::CustomTextInput"
      VALUE: "Dessert"
    label: "Action - Try to add same tag again"

- assertVisible:
    id: "RecipeTags::0::Chip"
    label: "Assert - Verify only one tag chip exists"

- assertNotVisible:
    id: "RecipeTags::1::Chip"
    label: "Assert - Verify duplicate tag was not added"

- assertVisible:
    text: "Dessert"
    label: "Assert - Verify original Dessert tag still present"
