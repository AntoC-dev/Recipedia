name: "6 - Recipe Edit Delete Ingredient Flow"
appId: "com.recipedia"
tags:
  - recipe-edit
---
- runFlow:
    file: "../../flows/recipe/adding/createBaseRecipeForDuplicateTests.yaml"
    label: "Action - Create temporary Test Recipe (Pasta 200g + Tomatoes 100g)"

- runFlow:
    file: "../../asserts/alerts/en/recipeAddedToDatabase.yaml"
    env:
      RECIPE_NAME: ".*"
    label: "Assert - Verify recipe added to database"

- tapOn:
    id: "BottomTabs::Search"
    label: "Action - Navigate to Search screen"

- tapOn:
    id: "SearchScreen::SearchBar"
    label: "Action - Focus on search bar"

- inputText:
    text: "Test Recipe"
    label: "Action - Search for the temporary recipe"

- waitForAnimationToEnd:
    label: "Wait for keyboard animation"

- runFlow:
    file: "../../flows/search/selectFirstSuggestion.yaml"
    label: "Select the first suggestion to close the dropdown and reveal the grid"

- tapOn:
    id: "SearchScreen::RecipeCards::.*::Cover"
    label: "Action - Open Test Recipe"

- extendedWaitUntil:
    visible:
      id: "Recipe::AppBar.*"
    timeout: 5000
    label: "Wait recipe screen to load"

- runFlow:
    file: "../../flows/recipe/tapRecipeEdit.yaml"
    label: "Action - Enter edit mode"

- runFlow:
    file: "../../flows/recipe/ingredients/deleteIngredientFromRecipe.yaml"
    env:
      INDEX: "0"
    label: "Action - Delete first ingredient (Pasta 200g)"

- waitForAnimationToEnd

- assertNotVisible:
    id: "RecipeIngredients::1::Row"
    label: "Assert - Pasta row is gone after deletion"

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::0::ActionsButton"
    direction: DOWN
    speed: 20
    timeout: 30000
    label: "Scroll to the remaining ingredient actions button"

- assertVisible:
    id: "RecipeIngredients::0::ActionsButton"
    label: "Actions button of Tomatoes is visible"
- tapOn:
    id: "RecipeIngredients::0::ActionsButton"
    label: "Open the actions menu of Tomatoes"
- assertVisible:
    id: "RecipeIngredients::0::DeleteItem"
    enabled: true
    label: "Delete item of Tomatoes is enabled"
- assertVisible:
    id: "RecipeIngredients::0::DeleteItem-title"
    text: "Delete"
    label: "Delete item of Tomatoes is labelled Delete"
- assertNotVisible:
    id: "RecipeIngredients::0::MoveUpItem"
    label: "Move up item is hidden on Tomatoes, the only ingredient"
- assertNotVisible:
    id: "RecipeIngredients::0::MoveDownItem"
    label: "Move down item is hidden on Tomatoes, the only ingredient"
- runFlow:
    file: "../../flows/recipe/ingredients/dismissIngredientActionsMenu.yaml"
    env:
      INDEX: "0"
    label: "Dismiss the actions menu of Tomatoes"

- tapOn:
    id: "Recipe::AppBar::Validate"
    label: "Action - Save changes"

- waitForAnimationToEnd

- assertNotVisible:
    id: "RecipeIngredients::.*::IngredientName"
    text: "Pasta"
    label: "Assert - Pasta is no longer in read-only ingredient list"

- runFlow:
    file: "../../asserts/recipe/common/assertIngredient.yaml"
    env:
      INGREDIENT_NAME: "Tomatoes"
      INGREDIENT_QUANTITY_AND_UNIT: "200 g"
    label: "Assert - Tomatoes ingredient is still present after save"

- tapOn:
    id: "Recipe::AppBar::Delete"
    label: "Delete the recipe"

- extendedWaitUntil:
    visible:
      id: "Recipe::Dialog::Confirm"
    timeout: 10000
    label: "Wait for recipe delete dialog to appear"

- tapOn:
    id: "Recipe::Dialog::Confirm"
    label: "Confirm the deletion"

- extendedWaitUntil:
    visible:
      id: "Recipe::Dialog::Confirm"
      text: "OK"
    timeout: 10000
    label: "Wait for recipe delete confirmation dialog to appear"

- tapOn:
    id: "Recipe::Dialog::Confirm"
    label: "Close the delete confirmation"

- extendedWaitUntil:
    notVisible:
      id: "Recipe::AppBar.*"
    timeout: 10000
    label: "Wait for recipe to close"

- tapOn:
    id: "SearchScreen::FiltersSelection::0::Chip"
    label: "Remove the recipe filter"
