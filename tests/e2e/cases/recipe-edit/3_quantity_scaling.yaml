name: "3 - Recipe Quantity Scaling Flow"
appId: "com.recipedia"
tags:
  - recipe-edit
---
- tapOn:
    id: "BottomTabs::Search"
    label: "Action - Navigate to Search screen"

- tapOn:
    id: "SearchScreen::SearchBar"
    label: "Action - Focus on search bar"

- inputText:
    text: "Chocolate"
    label: "Action - Search for Chocolate Cake"

- waitForAnimationToEnd:
    label: "Wait for keyboard animation"

- runFlow:
    file: "../../flows/search/selectFirstSuggestion.yaml"
    label: "Select the first suggestion to close the dropdown and reveal the grid"

- extendedWaitUntil:
    visible:
      id: "SearchScreen::RecipeCards::.*::Cover"
    timeout: 30000
    optional: true
    label: "Wait for chocolate cake recipe to appear in search results"

- tapOn:
    id: "SearchScreen::RecipeCards::.*::Cover"
    label: "Action - Open Chocolate Cake recipe"

- extendedWaitUntil:
    visible:
      id: "Recipe::AppBar"
    timeout: 30000
    optional: true
    label: "Wait for recipe screen to be displayed"
- runFlow:
    file: "../../asserts/recipe/readonly/en/chocolateCakeFor4Persons.yaml"
    label: "Assert - Verify initial state: 4 persons, scaled quantities"

- tapOn:
    id: "Recipe::AppBar::Edit"
    label: "Action - Enter edit mode"

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "RecipeImage"
    direction: UP
    speed: 20
    centerElement: true
    label: "Action - Scroll back to top"

- runFlow:
    file: "../../asserts/recipe/edit/chocolateCakeFor4Persons.yaml"
    label: "Assert - Verify edit mode: 4 persons, scaled quantities"

- runFlow:
    file: "../../flows/focusField.yaml"
    env:
      TARGET_ID: "RecipeIngredients::3::QuantityInput"
    label: "Action - Focus Butter quantity, left at screen centre by the assert"

- repeat:
    times: 8
    commands:
      - runFlow:
          file: "../../flows/toolbarPrevious.yaml"
          label: "Action - Previous toward persons: name/quantity of Butter, Sugar, Cocoa Powder, Flour (a swipe from the centre input cannot scroll the form)"

- assertVisible:
    id: "RecipePersons::NumericTextInput"
    label: "Assert - Persons input is on screen"

- runFlow:
    file: "../../flows/waitForKeyboard.yaml"
    label: "Assert - Keyboard is on screen"

- runFlow:
    file: "../../flows/toolbarDone.yaml"
    label: "Action - Close the keyboard with the persons input on screen"

- runFlow:
    file: "../../flows/recipe/editing/changePersonsFrom4To2.yaml"
    label: "Action - Change persons from 4 to 2"

- scrollUntilVisible:
    element:
      id: "RecipeImage::RoundButton"
    direction: UP
    speed: 20
    timeout: 120000
    label: "Action - Scroll back to top"

- runFlow:
    file: "../../asserts/recipe/edit/chocolateCakeFor2Persons.yaml"
    label: "Assert - Verify UI scaling: 2 persons, UI shows scaled quantities (66,67g, 16,67g, 50g, 33,34g)"

- tapOn:
    id: "Recipe::AppBar::Validate"
    label: "Action - Validate the edit"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "RecipeScalingSnackbar"
    timeout: 10000
    label: "Wait for the scaling-notice snackbar"

- assertVisible:
    id: "RecipeScalingSnackbar"
    label: "Assert - Scaling notice snackbar is displayed (by ID)"

- assertVisible:
    text: "Saved. Quantities were scaled from 2 to 4 servings — recipes are stored at your default serving size."
    label: "Assert - Scaling notice shows the full scaled-from-2-to-4 message (by text)"

- tapOn:
    text: "OK"
    label: "Action - Dismiss the scaling notice snackbar"

- scrollUntilVisible:
    element:
      id: "RecipeImage"
    direction: UP
    speed: 20
    centerElement: true
    label: "Action - Scroll back to top"

- runFlow:
    file: "../../asserts/recipe/readonly/en/chocolateCakeFor4Persons.yaml"
    label: "Assert - Verify read-only after edit: shows saved canonical recipe (4 persons)"

- tapOn:
    id: "Recipe::AppBar::BackButton"
    label: "Action - Return to Search screen"

- tapOn:
    id: "SearchScreen::FiltersSelection::0::Chip"
    label: "Action - Remove search filter"

- tapOn:
    id: "SearchScreen::SearchBar"
    label: "Action - Focus on search bar"

- inputText:
    text: "Chocolate"
    label: "Action - Search for Chocolate Cake again"

- waitForAnimationToEnd:
    label: "Wait for keyboard animation"

- runFlow:
    file: "../../flows/search/selectFirstSuggestion.yaml"
    label: "Select the first suggestion to close the dropdown and reveal the grid"

- extendedWaitUntil:
    visible:
      id: "SearchScreen::RecipeCards::7::Persons"
    timeout: 20000
    optional: true
    label: "Wait for chocolate cake card to load"

- assertVisible:
    id: "SearchScreen::RecipeCards::7::Persons"
    text: "4 persons"
    label: "Assert - Card is showing a 4 persons (default value) recipe"
- tapOn:
    id: "SearchScreen::RecipeCards::.*::Cover"
    label: "Action - Open Chocolate Cake recipe from search"

- runFlow:
    file: "../../asserts/recipe/readonly/en/chocolateCakeFor4Persons.yaml"
    label: "Assert - Verify that recipe came back to default number of persons and is strictly identical as what it were before"

- tapOn:
    id: "Recipe::AppBar::BackButton"
    label: "Action - Return to Search screen"
