name: "4 - OCR Use Similar Ingredient Flow"
appId: "com.recipedia"
tags:
  - ocr
---
- evalScript: ${output.modalImageCounter = 1}

- runFlow:
    file: "../../flows/recipe/adding/ocr/camera/openOCRCamera.yaml"
    label: "Setup - Open OCR from camera"

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::PrefixText"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Setup - Scroll down to ingredient section"

- runFlow:
    file: "../../flows/recipe/adding/ocr/gallery/ocrIngredientNames.yaml"
    env:
      RECIPE_NAME: quitoqueV3
    label: "Action - Scan Quitoque V3 ingredient names"

- repeat:
    times: 11
    commands:
      - runFlow:
          file: "../../flows/recipe/validation/validateOneIngredient.yaml"
          env:
            PREFIX: "RecipeValidation"
          label: "Action - Add one ingredient queued before purée de tomates"

- runFlow:
    file: "../../flows/recipe/ingredients/useFuzzyIngredient.yaml"
    env:
      NEW_ITEM_NAME: "purée de tomates"
    label: "Action - Use the similar ingredient for purée de tomates"

- runFlow:
    file: "../../flows/recipe/validation/validateAllIngredients.yaml"
    env:
      PREFIX: "RecipeValidation"
    label: "Action - Add the remaining ingredients"

- extendedWaitUntil:
    notVisible:
      id: "RecipeValidation::ValidationQueue::Ingredient::SimilarityDialog::Title"
    timeout: 10000
    label: "Wait for all validation dialogs to close"

- runFlow:
    file: "../../asserts/recipe/common/assertIngredientReplacedInPlace.yaml"
    env:
      INGREDIENT_INDEX: "9"
      INGREDIENT_NAME: "Tomatoes"
      LAST_INDEX: "11"
      INGREDIENT_COUNT: "12"
    label: "Assert - purée de tomates row became Tomatoes, no extra row"
