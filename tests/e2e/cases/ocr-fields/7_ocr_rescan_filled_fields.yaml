name: "7 - OCR Rescan Filled Fields Flow"
appId: "com.recipedia"
tags:
  - ocr
---
- runFlow:
    file: "../../flows/recipe/adding/ocr/gallery/ocrImage.yaml"
    env:
      RECIPE_NAME: hellofresh
    label: "Setup - Open recipe screen in OCR mode with HelloFresh image"

- runFlow:
    file: "../../flows/recipe/adding/ocr/gallery/ocrTitle.yaml"
    env:
      RECIPE_NAME: hellofresh
    label: "Action - OCR the title so the input is filled"

- runFlow:
    file: "../../flows/replaceAndDone.yaml"
    env:
      TARGET_ID: "RecipeTitle::CustomTextInput"
      VALUE: "Typed title"
    label: "Action - Replace the OCRed title with a typed one"

- runFlow:
    file: "../../flows/recipe/adding/ocr/gallery/ocrTitle.yaml"
    env:
      RECIPE_NAME: hellofresh
    label: "Action - Rescan the title through the inline icon"

- extendedWaitUntil:
    visible:
      id: "RecipeTitle::CustomTextInput"
      text: "Aiguillettes de poulet façon teriyaki.*"
    timeout: 60000
    label: "Assert - Rescanning the title replaces the typed value"

- runFlow:
    file: "../../flows/recipe/adding/ocr/gallery/ocrPreparation.yaml"
    env:
      RECIPE_NAME: hellofresh
    label: "Action - OCR the preparation steps"

- scrollUntilVisible:
    element:
      id: "RecipePreparation::EditableStep::0::TextInputTitle::CustomTextInput"
    direction: UP
    speed: 20
    centerElement: true
    label: "Action - Scroll to the first scanned step"

- runFlow:
    file: "../../asserts/recipe/ocr/aiguillettesPreparationSteps.yaml"
    env:
      FIRST_STEP_INDEX: "0"
    label: "Assert - The scan keeps the four sections with quantities in their content"

- scrollUntilVisible:
    element:
      id: "Recipe::RecipeNutrition::NutritionEmptyState::Title"
    direction: DOWN
    speed: 20
    timeout: 60000
    label: "Action - Scroll past the filled steps so the preparation scan button sits mid-screen"

- runFlow:
    file: "../../flows/recipe/adding/ocr/gallery/ocrPreparation.yaml"
    env:
      RECIPE_NAME: hellofresh
    label: "Action - Rescan the preparation steps"

- scrollUntilVisible:
    element:
      id: "RecipePreparation::EditableStep::4::TextInputTitle::CustomTextInput"
      text: "Cuire le riz"
    direction: UP
    speed: 20
    timeout: 120000
    label: "Assert - Rescanning appends a second copy of the steps"

- runFlow:
    file: "../../asserts/recipe/ocr/aiguillettesPreparationSteps.yaml"
    env:
      FIRST_STEP_INDEX: "4"
    label: "Assert - The rescan adds the four sections with quantities kept in their content"

- scrollUntilVisible:
    element:
      id: "RecipePreparation::AddButton::RoundButton"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Action - Scroll to the add step button right after the last step"

- assertNotVisible:
    id: "RecipePreparation::EditableStep::8::.*"
    label: "Assert - Neither scan creates extra steps from quantities or time ranges"
