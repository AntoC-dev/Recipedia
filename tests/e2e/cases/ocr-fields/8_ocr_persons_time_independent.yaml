name: "8 - OCR Persons And Time Independent Flow"
appId: "com.recipedia"
tags:
  - ocr
---
- runFlow:
    file: "../../flows/recipe/adding/ocr/gallery/ocrImage.yaml"
    env:
      RECIPE_NAME: quitoqueV1
    label: "Setup - Open recipe screen in OCR mode with Quitoque image"

- scrollUntilVisible:
    element:
      id: "RecipePersons::OpenModal::IconButton"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Action - Scroll to the persons scan icon"

- tapOn:
    id: "RecipePersons::OpenModal::IconButton"
    label: "Action - Scan persons through the inline icon"

- runFlow:
    file: "../../flows/recipe/adding/ocr/gallery/addAndSelectMostRecent.yaml"
    env:
      RECIPE_NAME: quitoqueV1
      FIELD_NAME: personsAndTime
    label: "Action - Pick the persons and time picture"

- extendedWaitUntil:
    visible:
      id: "RecipePersons::NumericTextInput"
      text: "2"
    timeout: 60000
    label: "Assert - Persons scan replaces the default count with the first row of the card"

- runFlow:
    file: "../../flows/replaceAndDone.yaml"
    env:
      TARGET_ID: "RecipePersons::NumericTextInput"
      VALUE: "7"
    label: "Action - Type 7 persons manually"

- scrollUntilVisible:
    element:
      id: "RecipeTime::OpenModal::RoundButton"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Action - Scroll to the time scan button"

- assertNotVisible:
    id: "RecipeTime::NumericTextInput"
    label: "Assert - Persons scan leaves the time empty"

- tapOn:
    id: "RecipeTime::OpenModal::RoundButton"
    label: "Action - Scan time"

- runFlow:
    file: "../../flows/recipe/adding/ocr/gallery/addAndSelectMostRecent.yaml"
    env:
      RECIPE_NAME: quitoqueV1
      FIELD_NAME: personsAndTime
    label: "Action - Pick the persons and time picture"

- extendedWaitUntil:
    visible:
      id: "RecipeTime::NumericTextInput"
    timeout: 60000
    label: "Assert - Time scan fills the time"

- runFlow:
    file: "../../flows/focusField.yaml"
    env:
      TARGET_ID: "RecipeTime::NumericTextInput"
    label: "Action - Focus the time input"

- runFlow:
    file: "../../flows/replaceFocused.yaml"
    env:
      TARGET_ID: "RecipeTime::NumericTextInput"
      VALUE: "40"
    label: "Action - Type 40 minutes without committing with the toolbar Done"

- tapOn:
    id: "RecipeTime::OpenModal::IconButton"
    label: "Action - Scan time through the inline icon while the input is focused"

- runFlow:
    file: "../../flows/recipe/adding/ocr/gallery/addAndSelectMostRecent.yaml"
    env:
      RECIPE_NAME: quitoqueV1
      FIELD_NAME: personsAndTime
    label: "Action - Pick the persons and time picture"

- extendedWaitUntil:
    visible:
      id: "RecipeTime::NumericTextInput"
      text: "25"
    timeout: 60000
    label: "Assert - Time scan replaces the typed time with the first row of the card"

- tapOn:
    id: "RecipeTime::PrefixText"
    label: "Action - Tap the time label so a still-focused input would blur"

- assertVisible:
    id: "RecipeTime::NumericTextInput"
    text: "25"
    label: "Assert - Leaving the input keeps the scanned time"

- scrollUntilVisible:
    element:
      id: "RecipePersons::NumericTextInput"
      text: "7"
    direction: UP
    speed: 20
    centerElement: true
    label: "Assert - Time scan keeps the typed persons count"

- scrollUntilVisible:
    element:
      id: "RecipeTime::NumericTextInput"
      text: "25"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Assert - Scrolling back keeps the scanned time"
