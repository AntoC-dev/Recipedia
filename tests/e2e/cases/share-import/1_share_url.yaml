name: "1 - Share Recipe URL From Browser Flow"
appId: "com.recipedia"
tags:
  - share-import
---
- tapOn:
    id: "BottomTabs::Home"
    label: "Setup - Return to Home screen"

- runFlow:
    when:
      platform: Android
    file: "../../flows/share/android/shareUrlFromChrome.yaml"
    env:
      RECIPE_URL: "https://www.hellofresh.fr/recipes/keftas-de-boeuf-and-semoule-aux-epices-66e83b9e7dfc60d59bf5f913"
    label: "Action - Share the recipe page from Chrome"

- runFlow:
    when:
      platform: iOS
    file: "../../flows/share/iOS/shareUrlFromSafari.yaml"
    env:
      RECIPE_URL: "https://www.hellofresh.fr/recipes/keftas-de-boeuf-and-semoule-aux-epices-66e83b9e7dfc60d59bf5f913"
    label: "Action - Share the recipe page from Safari"

- runFlow:
    file: "../../flows/recipe/adding/web/waitForScrapedRecipe.yaml"
    label: "Assert - Shared URL is scraped into the recipe screen"

- assertVisible:
    id: "RecipeTitle::CustomTextInput"
    text: "Keftas de bœuf & semoule aux épices avec de la menthe & une sauce yaourt"
    label: "Assert - Scraped recipe is the shared page"
