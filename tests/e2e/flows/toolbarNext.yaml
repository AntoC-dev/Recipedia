appId: "com.recipedia"
---
- tapOn:
    id: "keyboard.toolbar.next"
    label: "Tap the keyboard toolbar Next"

- waitForAnimationToEnd:
    label: "Wait for the focus move to settle"

- runFlow:
    when:
      platform: Android
    commands:
      - waitForAnimationToEnd:
          label: "Wait for the keyboard to switch type before typing"
