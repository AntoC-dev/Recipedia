appId: "com.recipedia"
---

- runFlow:
    file: "inputText.yaml"
    env:
      TARGET_ID: "${TARGET_ID}"
      VALUE: "${VALUE}"
    label: "Type ${VALUE} into ${TARGET_ID}"

- tapOn:
    id: "${DISMISS_ID}"
    label: "Tap ${DISMISS_ID} to commit the field and close the keyboard"

- runFlow:
    file: "waitForKeyboardDismiss.yaml"
    label: "Wait for the keyboard to close after committing ${TARGET_ID}"
