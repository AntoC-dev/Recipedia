appId: "com.recipedia"
---
# Wait for the keyboard to dismiss - platform specific
# iOS: waits for UIKit's keyboard layout view to be gone. `UIKeyboardLayoutStar`
# backs every keyboard the app raises — alphabetic, numeric and decimal alike —
# so one wait covers all of them, and unlike a key label it survives a locale
# change and does not assume the keyboard has a return key.
# Android: the IME is not in the view hierarchy, so it cannot be asserted gone;
# just wait for the dismissal animation. This helper must not itself dismiss
# the keyboard: hideKeyboard maps to a Back press on Android, and when the
# keyboard is already down (e.g. after committing a field) that Back reaches
# navigation and pops the current screen. Callers dismiss the keyboard
# themselves while it is still up.

- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          notVisible:
            id: "UIKeyboardLayoutStar.*"
          timeout: 60000
          label: "Verify the iOS keyboard is dismissed"

- runFlow:
    when:
      platform: Android
    commands:
      - waitForAnimationToEnd:
          label: "Wait for Android keyboard to dismiss"
