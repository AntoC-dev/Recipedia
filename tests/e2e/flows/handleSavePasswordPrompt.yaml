appId: "com.recipedia"
---
# Submitting the password field makes iOS offer to store it; the sheet owns the hierarchy until dismissed.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: "Save Password?"
          timeout: 15000
          label: "Wait for the save-password prompt"
      - tapOn:
          text: "Not Now"
          label: "Decline the save-password prompt"
