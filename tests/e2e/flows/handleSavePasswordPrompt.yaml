appId: "com.recipedia"
---
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: "Save Password?"
          timeout: 60000
          label: "Wait for the save-password prompt"
      - tapOn:
          text: "Not Now"
          label: "Decline the save-password prompt"
