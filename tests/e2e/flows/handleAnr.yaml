appId: "com.recipedia"
---
# Android-only: the platform gate is for speed, not correctness — it short-circuits before
# `visible:`, which costs a 4-8s hierarchy dump on the CI simulator.
- runFlow:
    when:
      platform: Android
      visible:
        text: ".*isn't responding.*"
    commands:
      - tapOn:
          text: "Wait"
          label: "Dismiss ANR dialog by tapping Wait"
