appId: "com.recipedia"
---
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "RecipeTags::RoundButton"
    direction: DOWN
    speed: 20
    timeout: 60000
    centerElement: true
    label: "Action - Scroll to tags section"

- waitForAnimationToEnd:
    label: "Wait for scroll to end"

- assertVisible:
    id: "RecipeTags::RoundButton"
    label: "Verify tags section is visible"

- tapOn:
    id: "RecipeTags::RoundButton"
    label: "Add tag to recipe"

- extendedWaitUntil:
    visible:
      id: "RecipeTags::List::${TAG_INDEX}::CustomTextInput"
    timeout: 3000
    label: "Wait for tag input field to appear"

- tapOn:
    id: "RecipeTags::List::${TAG_INDEX}::CustomTextInput"
    label: "Focus on tag input field"

- runFlow:
    file: "../../waitForKeyboard.yaml"
    label: "Wait for keyboard to appear"

- runFlow:
    file: "../../inputAndCommitText.yaml"
    env:
      TARGET_ID: "RecipeTags::List::${TAG_INDEX}::CustomTextInput"
      VALUE: "${TAG_NAME}"
      DISMISS_ID: "RecipeTags::ElementText"
    label: "Enter tag name"

- runFlow:
    file: "../../waitForKeyboardDismiss.yaml"
    label: "Wait for keyboard to dismiss"
