appId: "com.recipedia"
---
- scrollUntilVisible:
    element:
      id: "${SECTION}::AddButton::RoundButton"
    speed: 20
    centerElement: true
    label: "Scroll to the ${SECTION} add button"

- waitForAnimationToEnd

- tapOn:
    id: "${SECTION}::AddButton::RoundButton"
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
    label: "Add a ${SECTION} row"
