appId: "com.recipedia"
---

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "RecipePersons::NumericTextInput"
    direction: UP
    speed: 60
    centerElement: true
    label: "Scroll to persons field"

- waitForAnimationToEnd

- tapOn:
    id: "RecipePersons::NumericTextInput"
    label: "Focus on persons input"

- eraseText:
    label: "Erase current persons value"

- waitForAnimationToEnd:
    label: "Wait for keyboard animation"

- runFlow:
    file: "../../inputAndCommitText.yaml"
    env:
      TARGET_ID: "RecipePersons::NumericTextInput"
      VALUE: "2"
      DISMISS_ID: "RecipePersons::PrefixText"
    label: "Enter 2 persons"

- runFlow:
    file: "../../waitForKeyboardNumericDismiss.yaml"
    label: "Wait for numeric keyboard to dismiss"
