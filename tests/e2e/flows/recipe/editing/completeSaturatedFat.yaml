appId: "com.recipedia"
---
- scrollUntilVisible:
    element:
      id: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::SaturatedFat::NumericTextInput"
    speed: 20
    direction: UP
    centerElement: true
    label: "Scroll to Recipe::RecipeNutrition::NutritionTable::NutritionRow::SaturatedFat::NumericTextInput"

- runFlow:
    file: "../../focusField.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::SaturatedFat::NumericTextInput"
    label: "Focus saturated fat input"

- runFlow:
    file: "../../inputAndDone.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::SaturatedFat::NumericTextInput"
      VALUE: "2,5"
    label: "Enter saturated fat value"
