appId: "com.recipedia"
---

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::SaturatedFat::NumericTextInput"
    direction: UP
    speed: 60
    centerElement: true
    label: "Scroll to saturated fat field"

- waitForAnimationToEnd

- tapOn:
    id: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::SaturatedFat::NumericTextInput"
    label: "Tap saturated fat input"

- runFlow:
    file: "../../waitForKeyboard.yaml"
    label: "Wait for numeric keyboard to appear"

- runFlow:
    file: "../../inputAndCommitText.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::SaturatedFat::NumericTextInput"
      VALUE: "2,5"
      DISMISS_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::SaturatedFat::Text"
    label: "Enter saturated fat value"

- runFlow:
    file: "../../waitForKeyboardDismiss.yaml"
    label: "Wait for numeric keyboard to dismiss"
