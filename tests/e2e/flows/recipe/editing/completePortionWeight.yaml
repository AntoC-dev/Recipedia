appId: "com.recipedia"
---
- scrollUntilVisible:
    element:
      id: "Recipe::RecipeNutrition::NutritionTable::EditForm::PortionWeightNumericTextInput"
    speed: 20
    direction: DOWN
    centerElement: true
    timeout: 120000
    label: "Scroll to Recipe::RecipeNutrition::NutritionTable::EditForm::PortionWeightNumericTextInput"

- waitForAnimationToEnd

- runFlow:
    file: "../../focusField.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::EditForm::PortionWeightNumericTextInput"
    label: "Focus portion weight input"

- runFlow:
    file: "../../inputAndDone.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::EditForm::PortionWeightNumericTextInput"
      VALUE: "200"
    label: "Enter portion weight value"
