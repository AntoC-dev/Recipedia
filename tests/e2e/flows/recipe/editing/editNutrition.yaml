appId: "com.recipedia"
---
- runFlow:
    file: "../../scrollToEndTarget.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::Salt::NumericTextInput"
    label: "Scroll to the last nutrition row with the keyboard closed (the energy row can sit under the app bar and still count as visible)"

- waitForAnimationToEnd

- swipe:
    from:
      id: "Recipe::RecipeNutrition::NutritionTable-container"
    direction: DOWN
    label: "Bring the first nutrition row back from under the app bar"

- runFlow:
    file: "../../replaceText.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::EnergyKcal::NumericTextInput"
      VALUE: "${NEW_ENERGY_KCAL}"
    label: "Enter energy kcal value"

- runFlow:
    file: "../../toolbarNext.yaml"
    label: "Skip energy kj"

- runFlow:
    file: "../../toolbarNext.yaml"
    label: "Move to fat"

- runFlow:
    file: "../../replaceFocused.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::Fat::NumericTextInput"
      VALUE: "${NEW_FAT}"
    label: "Enter fat value"

- runFlow:
    file: "../../toolbarNext.yaml"
    label: "Skip saturated fat"

- runFlow:
    file: "../../toolbarNext.yaml"
    label: "Skip carbohydrates"

- runFlow:
    file: "../../toolbarNext.yaml"
    label: "Skip sugars"

- runFlow:
    file: "../../toolbarNext.yaml"
    label: "Skip fiber"

- runFlow:
    file: "../../toolbarNext.yaml"
    label: "Move to protein"

- runFlow:
    file: "../../replaceFocused.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::Protein::NumericTextInput"
      VALUE: "${NEW_PROTEIN}"
    label: "Enter protein value"

- runFlow:
    file: "../../toolbarDone.yaml"
    label: "Close the keyboard after the last field"
