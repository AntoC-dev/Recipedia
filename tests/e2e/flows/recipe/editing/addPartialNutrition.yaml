appId: "com.recipedia"
---
- scrollUntilVisible:
    element:
      id: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::EnergyKcal::NumericTextInput"
    speed: 20
    direction: DOWN
    centerElement: true
    label: "Scroll to Recipe::RecipeNutrition::NutritionTable::NutritionRow::EnergyKcal::NumericTextInput"

- runFlow:
    file: "../../focusField.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::EnergyKcal::NumericTextInput"
    label: "Focus energy kcal input"

- runFlow:
    file: "../../inputAndNext.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::EnergyKcal::NumericTextInput"
      VALUE: "250"
    label: "Enter energy kcal value"

- runFlow:
    file: "../../inputAndNext.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::EnergyKj::NumericTextInput"
      VALUE: "1000"
    label: "Enter energy kj value"

- runFlow:
    file: "../../inputAndNext.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::Fat::NumericTextInput"
      VALUE: "10"
    label: "Enter fat value"

- runFlow:
    file: "../../toolbarNext.yaml"
    label: "Skip the saturated fat row"

- runFlow:
    file: "../../inputAndNext.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::Carbohydrates::NumericTextInput"
      VALUE: "30"
    label: "Enter carbohydrates value"

- runFlow:
    file: "../../inputAndNext.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::Sugars::NumericTextInput"
      VALUE: "1"
    label: "Enter sugar value"

- runFlow:
    file: "../../inputAndNext.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::Fiber::NumericTextInput"
      VALUE: "42"
    label: "Enter fiber value"

- runFlow:
    file: "../../inputAndNext.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::Protein::NumericTextInput"
      VALUE: "15"
    label: "Enter protein value"

- runFlow:
    file: "../../inputAndDone.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::NutritionRow::Salt::NumericTextInput"
      VALUE: "3"
    label: "Enter salt value and close the keyboard"
