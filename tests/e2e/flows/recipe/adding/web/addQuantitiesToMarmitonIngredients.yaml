appId: "com.recipedia"
---
- scrollUntilVisible:
    element:
      id: "RecipeIngredients::0::QuantityInput"
    direction: DOWN
    centerElement: true
    label: "Scroll to the first quantity with the keyboard closed"

- waitForAnimationToEnd

- runFlow:
    file: "../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::QuantityInput"
    label: "Focus the first quantity"

- runFlow:
    file: "../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::QuantityInput"
      VALUE: "1"
    label: "Fill Oignon quantity: 1"

- runFlow:
    file: "../../../toolbarNext.yaml"
    label: "Skip the name of ingredient 1"

- runFlow:
    file: "../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::1::QuantityInput"
      VALUE: "100"
    label: "Fill Cheddar quantity: 100"

- runFlow:
    file: "../../../toolbarNext.yaml"
    label: "Skip the name of ingredient 2"

- runFlow:
    file: "../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::2::QuantityInput"
      VALUE: "4"
    label: "Fill Pain pour hamburger quantity: 4"

- runFlow:
    file: "../../../toolbarNext.yaml"
    label: "Skip the name of ingredient 3"

- runFlow:
    file: "../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::3::QuantityInput"
      VALUE: "400"
    label: "Fill Viande hachée quantity: 400"

- runFlow:
    file: "../../../toolbarNext.yaml"
    label: "Skip the name of ingredient 4"

- runFlow:
    file: "../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::4::QuantityInput"
      VALUE: "1"
    label: "Fill Tomate quantity: 1"

- runFlow:
    file: "../../../toolbarNext.yaml"
    label: "Skip the name of ingredient 5"

- runFlow:
    file: "../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::5::QuantityInput"
      VALUE: "50"
    label: "Fill Salade quantity: 50"

- runFlow:
    file: "../../../toolbarNext.yaml"
    label: "Skip the name of ingredient 6"

- runFlow:
    file: "../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::6::QuantityInput"
      VALUE: "30"
    label: "Fill Moutarde quantity: 30"

- runFlow:
    file: "../../../toolbarNext.yaml"
    label: "Skip the name of ingredient 7"

- runFlow:
    file: "../../../inputAndDone.yaml"
    env:
      TARGET_ID: "RecipeIngredients::7::QuantityInput"
      VALUE: "30"
    label: "Fill Ketchup quantity: 30"

- scrollUntilVisible:
    element:
      id: "RecipeImage"
    direction: UP
    speed: 85
    timeout: 120000
    label: "Scroll back to top"

- waitForAnimationToEnd
