appId: "com.recipedia"
---
- scrollUntilVisible:
    element:
      id: "RecipeTags::RoundButton"
    centerElement: true
    label: "Scroll to tags's adding button"

- tapOn:
    id: "RecipeTags::RoundButton"
    label: "Add a new tag"

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeTags::List::0::CustomTextInput"
    label: "Focus the new tag TextInput"

- runFlow:
    file: "../../../../inputAndDone.yaml"
    env:
      TARGET_ID: "RecipeTags::List::0::CustomTextInput"
      VALUE: "Japanese"
    label: "Write the tag in the input text"
