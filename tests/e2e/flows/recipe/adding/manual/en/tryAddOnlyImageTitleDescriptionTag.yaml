appId: "com.recipedia"
---
- scrollUntilVisible:
    element:
      id: "RecipeTags::RoundButton"
    speed: 20
    centerElement: true
    label: "Scroll to tags's adding button"

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "RecipeTags::RoundButton"
    direction: UP
    speed: 20
    centerElement: true
    label: "Bring the button back if scroll momentum carried it off screen"

- tapOn:
    id: "RecipeTags::RoundButton"
    label: "Add a new tag"

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeTags::List::0::CustomTextInput"
    label: "Focus the new tag TextInput"

- runFlow:
    file: "../../../../inputAndDone.yaml"
    env:
      TARGET_ID: "RecipeTags::List::0::CustomTextInput"
      VALUE: "Japanese"
    label: "Write the tag in the input text"
