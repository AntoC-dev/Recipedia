appId: "com.recipedia"
---
- runFlow:
    file: "../../en/addRecipeImage.yaml"
    label: "Add recipe image"

- scrollUntilVisible:
    element:
      id: "RecipeTags::RoundButton"
    speed: 20
    direction: DOWN
    timeout: 120000
    centerElement: true
    label: "Scroll to the tags add button"

- tapOn:
    id: "RecipeTags::RoundButton"
    label: "Press the round button of first tags"

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeTags::List::0::CustomTextInput"
    label: "Focus the TextInput of first tags"

- runFlow:
    file: "../../../../inputAndDone.yaml"
    env:
      TARGET_ID: "RecipeTags::List::0::CustomTextInput"
      VALUE: "Healthy"
    label: "Enter text for recipe first tag"

- scrollUntilVisible:
    element:
      id: "RecipeTags::RoundButton"
    direction: DOWN
    speed: 20
    timeout: 60000
    centerElement: true
    label: "Scroll to ensure add button is still visible"

- waitForAnimationToEnd

- tapOn:
    id: "RecipeTags::RoundButton"
    label: "Press the round button of second tags"

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "RecipeTags::0::Chip"
    direction: UP
    speed: 20
    label: "Scroll up to ensure second tag's text input is visible"

- waitForAnimationToEnd

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeTags::List::1::CustomTextInput"
    label: "Focus the TextInput of second tags"

- extendedWaitUntil:
    visible:
      id: "RecipeTags::List::1::AutocompleteItem::Breakfast"
    timeout: 30000
    label: "Wait for the autocomplete list to appear"

- repeat:
    times: 5
    while:
      notVisible:
        id: "RecipeTags::List::1::AutocompleteItem::Seafood"
    commands:
      - swipe:
          from:
            id: "RecipeTags::List::1::AutocompleteList"
          direction: UP
          duration: 500
          label: "Scroll the tag dropdown down towards Seafood"
      - waitForAnimationToEnd:
          label: "Wait for scrolling animation to end"

- assertVisible:
    id: "RecipeTags::List::1::AutocompleteItem::Seafood"
    label: "Assert - Seafood tag is displayed"

- tapOn:
    id: "RecipeTags::List::.*::AutocompleteItem::Seafood"
    text: "Seafood"
    label: "Press the tag from dropdown list"

- runFlow:
    file: "../../../../waitForKeyboardDismiss.yaml"
    label: "Wait for keyboard to hide"

- extendedWaitUntil:
    notVisible:
      id: "RecipeTags::List::.*::AutocompleteItem::Seafood"
    timeout: 10000
    label: "Wait for the second chip to disappear"

- scrollUntilVisible:
    element:
      id: "RecipeTags::0::Chip"
    speed: 20
    direction: UP
    timeout: 120000
    label: "Action - Scroll back to chip parts"

- assertVisible:
    id: "RecipeTags::1::Chip"
    label: "Assert - Second tag chip is visible"

- runFlow:
    file: "../../../addRow.yaml"
    env:
      SECTION: "RecipeIngredients"
    label: "Add ingredient row 1"

- runFlow:
    file: "../../../addRow.yaml"
    env:
      SECTION: "RecipeIngredients"
    label: "Add ingredient row 2"

- runFlow:
    file: "../../../addRow.yaml"
    env:
      SECTION: "RecipeIngredients"
    label: "Add ingredient row 3"

- runFlow:
    file: "../../../addRow.yaml"
    env:
      SECTION: "RecipeIngredients"
    label: "Add ingredient row 4"

- runFlow:
    file: "../../../addRow.yaml"
    env:
      SECTION: "RecipePreparation"
    label: "Add preparation step 1"

- runFlow:
    file: "../../../addRow.yaml"
    env:
      SECTION: "RecipePreparation"
    label: "Add preparation step 2"

- runFlow:
    file: "../../../addRow.yaml"
    env:
      SECTION: "RecipePreparation"
    label: "Add preparation step 3"

- scrollUntilVisible:
    element:
      id: "RecipeTitle::CustomTextInput"
    speed: 20
    direction: UP
    centerElement: true
    label: "Scroll to RecipeTitle::CustomTextInput"

- waitForAnimationToEnd

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeTitle::CustomTextInput"
    label: "Focus the title"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeTitle::CustomTextInput"
      VALUE: "Aiguillettes de poulet a la sauce satay"
    label: "Enter the title, Next moves to the description"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeDescription::CustomTextInput"
      VALUE: "Cuisinez nos filets de poulet francais avec du riz basmati bio et une sauce satay maison: un condiment asiatique a base de cacahuetes et gingembre !"
    label: "Enter the description, Next moves to the persons"

- runFlow:
    file: "../../../../toolbarNext.yaml"
    label: "Skip the persons field with the toolbar Next"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::NameInput::CustomTextInput"
      VALUE: "Chicken Breast"
    label: "Enter first ingredient name (exact match), Next moves to its quantity"

- runFlow:
    file: "../../../../inputAndDone.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::QuantityInput"
      VALUE: "200"
    label: "Enter first ingredient quantity and close the keyboard"

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeIngredients::2::NameInput::CustomTextInput"
    label: "Focus the third ingredient name (keyboard closed, row visible)"

- runFlow:
    file: "../../../../inputText.yaml"
    env:
      TARGET_ID: "RecipeIngredients::2::NameInput::CustomTextInput"
      VALUE: "Oni"
    label: "Enter text for recipe third ingredient name (partial)"

- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "RecipeIngredients::2::NameInput::AutocompleteItem::Onions"
          label: "Press the ingredient from the dropdown"
      - runFlow:
          file: "../../../../waitForKeyboardDismiss.yaml"
          label: "Wait for keyboard to disappear"

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "Done"
          label: "Tap Done key to dismiss keyboard on iOS"
      - runFlow:
          file: "../../../../waitForKeyboardDismiss.yaml"
          label: "Wait for keyboard to disappear"
      - extendedWaitUntil:
          visible:
            id: "RecipeValidation::ValidationQueue::Ingredient::SimilarityDialog::Title"
          timeout: 30000
          label: "Wait for validation dialog to appear"
      - tapOn:
          id: "RecipeValidation::ValidationQueue::Ingredient::SimilarityDialog::UseButton"
          label: "Tap on the use button of similarity dialog"
      - extendedWaitUntil:
          notVisible:
            id: "RecipeValidation::ValidationQueue::Ingredient::SimilarityDialog::Title"
          timeout: 30000
          label: "Wait for validation dialog to disappear"

- runFlow:
    file: "../../enterIngredientQuantity.yaml"
    env:
      INDEX: "2"
      VALUE: "2"
    label: "Fill third ingredient quantity: 2"

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeIngredients::3::NameInput::CustomTextInput"
    label: "Focus the fourth ingredient name"

- tapOn:
    id: "RecipeIngredients::3::NameInput::AutocompleteItem::Avocado"
    label: "Press the ingredient from the dropdown"

- extendedWaitUntil:
    notVisible:
      id: "RecipeIngredients::3::NameInput::AutocompleteItem::Avocado"
    timeout: 30000
    label: "Wait for autocomplete list to disappear"

- runFlow:
    file: "../../enterIngredientQuantity.yaml"
    env:
      INDEX: "3"
      VALUE: "5"
    label: "Fill fourth ingredient quantity: 5"

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::1::NameInput::CustomTextInput"
    direction: UP
    speed: 20
    centerElement: true
    label: "Scroll back up to the second ingredient name"

- waitForAnimationToEnd

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeIngredients::1::NameInput::CustomTextInput"
    label: "Focus the second ingredient name"

- runFlow:
    file: "../../../../inputAndCommitText.yaml"
    env:
      TARGET_ID: "RecipeIngredients::1::NameInput::CustomTextInput"
      VALUE: "Non-existing-ingredient"
      DISMISS_ID: "RecipeIngredients::1::Unit"
    label: "Enter a non-existing name in the second (middle) row"

- assertVisible:
    id: "RecipeValidation::ValidationQueue::Ingredient::SimilarityDialog::Title"
    label: "Assert - Similarity dialog is visible"

- tapOn:
    id: "RecipeValidation::ValidationQueue::Ingredient::SimilarityDialog::CancelButton"
    label: "Tap on the cancel button of similarity dialog"

- extendedWaitUntil:
    notVisible:
      id: "RecipeIngredients::3::NameInput::CustomTextInput"
    timeout: 30000
    label: "Wait for the fourth row to disappear (the second row was removed, the filled rows shifted up)"

- scrollUntilVisible:
    element:
      id: "RecipeTime::NumericTextInput"
    speed: 20
    direction: DOWN
    centerElement: true
    label: "Scroll to RecipeTime::NumericTextInput"

- waitForAnimationToEnd

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeTime::NumericTextInput"
    label: "Focus the time"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeTime::NumericTextInput"
      VALUE: "20"
    label: "Enter the time, Next moves to the first step title"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::0::TextInputTitle::CustomTextInput"
      VALUE: "Le riz"
    label: "Enter first step title, Next moves to its paragraph"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::0::TextInputContent::CustomTextInput"
      VALUE: "Portez a ebullition une casserole d'eau salee.Faites cuire le riz selon les indications du paquet.Pendant ce temps, preparez les filets de poulet a la sauce satay."
    label: "Enter the first paragraph, Next moves to the second step title"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::1::TextInputTitle::CustomTextInput"
      VALUE: "La sauce"
    label: "Enter second step title, Next moves to its paragraph"

- runFlow:
    file: "../../../../appendText.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::1::TextInputContent::CustomTextInput"
      VALUE: "Dans le bol d'un mixeur, deposez les ingredients suivants :"
    label: "Enter text for recipe second preparation paragraph (first line)"

- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: "ENTER"

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "Return"
          label: "Tap Return key to go to a new line"

- runFlow:
    file: "../../../../appendText.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::1::TextInputContent::CustomTextInput"
      VALUE: "epluchez et hachez le gingembre."
    label: "Enter text for recipe second preparation paragraph (second line)"

- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: "ENTER"

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "Return"
          label: "Tap Return key to go to a new line"

- runFlow:
    file: "../../../../appendText.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::1::TextInputContent::CustomTextInput"
      VALUE: "Ajoutez les cacahuetes, le sucre et le lait de coco."
    label: "Enter text for recipe second preparation paragraph (third line)"

- runFlow:
    file: "../../../../appendText.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::1::TextInputContent::CustomTextInput"
      VALUE: "Salez, poivrez. Mixez jusqu'a obtenir une texture homogene."
    label: "Enter text for recipe second preparation paragraph (fourth line)"

- runFlow:
    file: "../../../../toolbarNext.yaml"
    label: "Leave the second paragraph with the toolbar Next"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::2::TextInputTitle::CustomTextInput"
      VALUE: "LA CUISSON DU POULET"
    label: "Enter third step title, Next moves to its paragraph"

- inputText:
    text: "Coupez les filets de poulet en lanieres.\nemincez l'oignon.\nPressez ou hachez l'ail.\nDans une poele, faites chauffer un filet d'huile de cuisson a feu moyen a vif."
    label: "Enter text for recipe third preparation paragraph"

- assertVisible:
    id: "RecipePreparation::EditableStep::2::TextInputContent::CustomTextInput"
    text: "[\\s\\S]*a feu moyen a vif[.][\\s\\S]*"
    label: "Check the third paragraph holds its last line before closing the keyboard"

- runFlow:
    file: "../../../../toolbarDone.yaml"
    label: "Close the keyboard after the last field of the pass"

- scrollUntilVisible:
    element:
      id: "Recipe::RecipeNutrition::NutritionEmptyState::AddButton::RoundButton"
    speed: 20
    direction: DOWN
    label: "Scroll to see the nutrition add button"
