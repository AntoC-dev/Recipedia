appId: "com.recipedia"
---
- scrollUntilVisible:
    element:
      id: "RecipeDescription::CustomTextInput"
    direction: DOWN
    centerElement: true
    label: "Scroll to RecipeDescription::CustomTextInput"

- waitForAnimationToEnd

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeDescription::CustomTextInput"
    label: "Focus RecipeDescription::CustomTextInput"

- runFlow:
    file: "../../../../inputAndDone.yaml"
    env:
      TARGET_ID: "RecipeDescription::CustomTextInput"
      VALUE: "Description"
    label: "Write the description in the input text"
