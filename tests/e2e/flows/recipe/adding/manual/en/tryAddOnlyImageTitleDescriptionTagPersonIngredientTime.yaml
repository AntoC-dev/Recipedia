appId: "com.recipedia"
---
- scrollUntilVisible:
    element:
      id: "RecipeTime::NumericTextInput"
    speed: 20
    direction: DOWN
    centerElement: true
    label: "Scroll to RecipeTime::NumericTextInput"

- waitForAnimationToEnd

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeTime::NumericTextInput"
    label: "Focus RecipeTime::NumericTextInput"

- runFlow:
    file: "../../../../inputAndDone.yaml"
    env:
      TARGET_ID: "RecipeTime::NumericTextInput"
      VALUE: "56789"
    label: "Write the time in the input text"
