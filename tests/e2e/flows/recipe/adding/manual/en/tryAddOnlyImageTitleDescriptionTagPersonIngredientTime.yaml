appId: "com.recipedia"
---

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "RecipeTime::NumericTextInput"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll to time section"

- waitForAnimationToEnd

- tapOn:
    id: "RecipeTime::NumericTextInput"
    label: "Press time input"

- runFlow:
    file: "../../../../waitForKeyboard.yaml"
    label: "Wait for numeric keyboard to appear"

- runFlow:
    file: "../../../../inputAndCommitText.yaml"
    env:
      TARGET_ID: "RecipeTime::NumericTextInput"
      VALUE: "56789"
      DISMISS_ID: "RecipeTime::PrefixText"
    label: "Write the time in the input text"

- runFlow:
    file: "../../../../waitForKeyboardDismiss.yaml"
    label: "Wait for numeric keyboard to dismiss"
