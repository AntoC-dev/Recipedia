appId: "com.recipedia"
---
- runFlow:
    file: "openAddManually.yaml"
    label: "Open manual recipe creation"

- runFlow:
    file: "../../en/addRecipeImage.yaml"
    label: "Add an image to this recipe"

- runFlow:
    file: "../../../addRow.yaml"
    env:
      SECTION: "RecipeIngredients"
    label: "Add an ingredient row"

- runFlow:
    file: "../../../addRow.yaml"
    env:
      SECTION: "RecipePreparation"
    label: "Add the preparation step"

- scrollUntilVisible:
    element:
      id: "RecipeTitle::CustomTextInput"
    direction: UP
    centerElement: true
    label: "Scroll to the title with the keyboard closed"

- waitForAnimationToEnd

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeTitle::CustomTextInput"
    label: "Focus the title"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeTitle::CustomTextInput"
      VALUE: "E2E Test Recipe"
    label: "Enter recipe title"

- runFlow:
    file: "../../../../toolbarNext.yaml"
    label: "Skip the description"

- runFlow:
    file: "../../../../toolbarNext.yaml"
    label: "Skip the persons, Next moves to the first ingredient name"

- runFlow:
    file: "../../../../inputText.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::NameInput::CustomTextInput"
      VALUE: "RecipeIng"
    label: "Enter the newly created ingredient name"

- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: "RecipeIngredients::0::NameInput::AutocompleteItem::RecipeIngredient"
          label: "New ingredient id is displayed in dropdown"
      - assertVisible:
          text: "RecipeIngredient"
          label: "New ingredient text is displayed in dropdown"
      - tapOn:
          id: "RecipeIngredients::0::NameInput::AutocompleteItem::RecipeIngredient"
          label: "Select the new ingredient"
      - runFlow:
          file: "../../../../waitForKeyboardDismiss.yaml"
          label: "Wait for keyboard to hide"

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "Done"
          label: "Hide the keyboard on iOS"
      - assertVisible:
          id: "RecipeValidation::ValidationQueue::Ingredient::SimilarityDialog::Title"
          label: "Similar ingredient dialog is visible"
      - tapOn:
          id: "RecipeValidation::ValidationQueue::Ingredient::SimilarityDialog::UseButton"
          label: "Validate to use this ingredient"

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::QuantityInput"
    label: "Focus the first ingredient quantity"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::QuantityInput"
      VALUE: "100"
    label: "Fill first ingredient quantity: 100, Next moves to the time"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeTime::NumericTextInput"
      VALUE: "10"
    label: "Enter cooking time, Next moves to the step title"

- runFlow:
    file: "../../../../toolbarNext.yaml"
    label: "Skip the step title"

- runFlow:
    file: "../../../../inputAndDone.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::0::TextInputContent::CustomTextInput"
      VALUE: "Test preparation step"
    label: "Enter preparation instructions"

- tapOn:
    id: "Recipe::BottomActionButton"

- runFlow:
    file: "../../../../../asserts/alerts/en/recipeAddedToDatabase.yaml"
    env:
      RECIPE_NAME: ".*"
    label: "Assert - Verify recipe added to database"
