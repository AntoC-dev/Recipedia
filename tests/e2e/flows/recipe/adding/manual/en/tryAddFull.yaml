appId: "com.recipedia"
---
- runFlow:
    file: "../../../addRow.yaml"
    env:
      SECTION: "RecipePreparation"
    label: "Press new preparation step button"

- scrollUntilVisible:
    element:
      id: "RecipePreparation::EditableStep::0::TextInputTitle::CustomTextInput"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll to the step input, keyboard closed"

- waitForAnimationToEnd

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::0::TextInputTitle::CustomTextInput"
    label: "Focus preparation step title"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::0::TextInputTitle::CustomTextInput"
      VALUE: "Step title"
    label: "Write the step title, Next moves to its paragraph"

- runFlow:
    file: "../../../../inputAndDone.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::0::TextInputContent::CustomTextInput"
      VALUE: "Step paragraph"
    label: "Write the step paragraph and close the keyboard"
