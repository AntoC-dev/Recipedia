appId: "com.recipedia"
---
- runFlow:
    file: "openAddManually.yaml"
    label: "Open manual recipe creation"

- runFlow:
    file: "../../en/addRecipeImage.yaml"
    label: "Add an image to this recipe"

- scrollUntilVisible:
    element:
      id: "RecipeTags::RoundButton"
    direction: DOWN
    centerElement: true
    label: "Scroll down to find add tag button"

- tapOn:
    id: "RecipeTags::RoundButton"
    label: "Tap to add tag to recipe"

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeTags::List::0::CustomTextInput"
    label: "Focus on first tag input"

- runFlow:
    file: "../../../../inputText.yaml"
    env:
      TARGET_ID: "RecipeTags::List::0::CustomTextInput"
      VALUE: "RecipeT"
    label: "Enter the newly created tag name"

- waitForAnimationToEnd:
    label: "Wait for keyboard animation"

- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: "RecipeTags::List::0::AutocompleteItem::RecipeTag"
          label: "New tag id is displayed in dropdown"
      - assertVisible:
          text: "RecipeTag"
          label: "New tag text is displayed in dropdown"
      - tapOn:
          id: "RecipeTags::List::0::AutocompleteItem::RecipeTag"
          label: "Select the new tag"
      - runFlow:
          file: "../../../../waitForKeyboardDismiss.yaml"
          label: "Wait for keyboard to hide"

- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: "RecipeTags::List::0::AutocompleteItem::RecipeTag"
          label: "New tag id is displayed in dropdown"
      - assertVisible:
          text: "RecipeTag"
          label: "New tag text is displayed in dropdown"
      - tapOn:
          id: "Done"
          label: "Tap Done key to validate the tag on iOS"
      - runFlow:
          file: "../../../../waitForKeyboardDismiss.yaml"
          label: "Wait for keyboard to hide"
      - assertVisible:
          id: "RecipeValidation::ValidationQueue::Tag::SimilarityDialog::Title"
          label: "Tag validation dialog is visible"
      - assertVisible:
          id: "RecipeValidation::ValidationQueue::Tag::SimilarityDialog::Content"
          text: ".*RecipeTag.*"
          label: "Tag validation dialog contains the newly created tag"
      - tapOn:
          id: "RecipeValidation::ValidationQueue::Tag::SimilarityDialog::UseButton"
          label: "Tap on use button to dismiss tag validation dialog"
      - extendedWaitUntil:
          notVisible:
            id: "RecipeValidation::ValidationQueue::Tag::SimilarityDialog::Title"
          timeout: 3000
          label: "Wait for dialog to disappear"

- runFlow:
    file: "../../../addRow.yaml"
    env:
      SECTION: "RecipeIngredients"
    label: "Add an ingredient row"

- runFlow:
    file: "../../../addRow.yaml"
    env:
      SECTION: "RecipePreparation"
    label: "Add the preparation step"

- scrollUntilVisible:
    element:
      id: "RecipeTitle::CustomTextInput"
    direction: UP
    centerElement: true
    label: "Scroll to RecipeTitle::CustomTextInput"

- waitForAnimationToEnd

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeTitle::CustomTextInput"
    label: "Focus on recipe title input"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeTitle::CustomTextInput"
      VALUE: "E2E Test Recipe"
    label: "Enter recipe title"

- runFlow:
    file: "../../../../toolbarNext.yaml"
    label: "Skip the description"

- runFlow:
    file: "../../../../toolbarNext.yaml"
    label: "Skip the persons"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::NameInput::CustomTextInput"
      VALUE: "Tomatoes"
    label: "Enter ingredient name (exact match, Next moves to its quantity)"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::QuantityInput"
      VALUE: "100"
    label: "Fill first ingredient quantity: 100, Next moves to the time"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeTime::NumericTextInput"
      VALUE: "10"
    label: "Enter cooking time, Next moves to the step title"

- runFlow:
    file: "../../../../toolbarNext.yaml"
    label: "Skip the step title"

- runFlow:
    file: "../../../../inputAndDone.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::0::TextInputContent::CustomTextInput"
      VALUE: "Test preparation step"
    label: "Enter preparation instructions"

- tapOn:
    id: "Recipe::BottomActionButton"

- runFlow:
    file: "../../../../../asserts/alerts/en/recipeAddedToDatabase.yaml"
    env:
      RECIPE_NAME: ".*"
    label: "Assert - Verify recipe added to database"
