appId: "com.recipedia"
---
- scrollUntilVisible:
    element:
      id: "RecipePersons::NumericTextInput"
    direction: DOWN
    centerElement: true
    label: "Scroll to RecipePersons::NumericTextInput"

- waitForAnimationToEnd

- runFlow:
    file: "../../../../replaceAndDone.yaml"
    env:
      TARGET_ID: "RecipePersons::NumericTextInput"
      VALUE: "321"
    label: "Write the number of person in the input text"
