appId: "com.recipedia"
---

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::0::NameInput::CustomTextInput"
    speed: 20
    direction: DOWN
    centerElement: true
    label: "Scroll to RecipeIngredients::0::NameInput::CustomTextInput"

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::NameInput::CustomTextInput"
    label: "Press on ingredient name input"

- tapOn:
    id: "RecipeIngredients::0::Unit"
    label: "Tap the unit cell to blur the name input and close the keyboard"

- runFlow:
    file: "../../../../waitForKeyboardDismiss.yaml"
    label: "Wait for keyboard to dismiss"
