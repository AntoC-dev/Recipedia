appId: "com.recipedia"
---
- scrollUntilVisible:
    element:
      id: "RecipeIngredients::${INDEX}::QuantityInput"
    speed: 20
    direction: DOWN
    centerElement: true
    label: "Scroll to ingredient ${INDEX} quantity with the keyboard closed"

- runFlow:
    file: "../../focusField.yaml"
    env:
      TARGET_ID: "RecipeIngredients::${INDEX}::QuantityInput"
    label: "Focus ingredient ${INDEX} quantity"

- runFlow:
    file: "../../inputAndDone.yaml"
    env:
      TARGET_ID: "RecipeIngredients::${INDEX}::QuantityInput"
      VALUE: "${VALUE}"
    label: "Type ${VALUE} as quantity for ingredient ${INDEX}"
