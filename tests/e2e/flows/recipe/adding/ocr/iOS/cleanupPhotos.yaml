appId: "com.recipedia"
---
- repeat:
    while:
      notVisible:
        text: "No Photos or Videos"
    commands:
      - extendedWaitUntil:
          visible:
            id: "PXGGridLayout-Info"
          timeout: 30000
          label: "Wait for the photo grid before deleting, never trust a single visibility check"

      - runFlow:
          when:
            visible:
              text: "Continue"
          commands:
            - tapOn:
                text: "Continue"
                label: "Close the what's new screen"
          label: "Dismiss what's new screen if it appeared late"

      - tapOn:
          text: "Select"
          label: "Enter select mode"

      - extendedWaitUntil:
          visible:
            text: "Select Items"
          timeout: 30000
          label: "Wait for select mode"

      - swipe:
          start: "10%,22%"
          end: "90%,50%"
          duration: 1500
          label: "Drag across the grid to select the photos of the first rows at once (a longer vertical drag scrolls instead)"

      - extendedWaitUntil:
          visible:
            text: "Delete"
            enabled: true
          timeout: 30000
          label: "Wait for the delete button to be enabled"

      - tapOn:
          text: "Delete"
          label: "Tap on the delete button"

      - extendedWaitUntil:
          visible:
            text: "Delete (\\d+ )?Photos?"
          timeout: 30000
          label: "Wait for the deletion confirmation to appear"

      - tapOn:
          text: "Delete (\\d+ )?Photos?"
          label: "Confirm the deletion"

      - extendedWaitUntil:
          notVisible:
            text: "Delete (\\d+ )?Photos?"
          timeout: 30000
          label: "Wait for the deletion confirmation to close"
