appId: "com.recipedia"
---
- repeat:
    while:
      visible:
        id: "PXGGridLayout-Info"
    commands:
      - tapOn:
          text: "Select"
          label: "Enter select mode"

      - extendedWaitUntil:
          visible:
            text: "Select Items"
          timeout: 30000
          label: "Wait for select mode"

      - tapOn:
          id: "PXGGridLayout-Info"
          index: 0
          label: "Select the first photo of the grid"

      - extendedWaitUntil:
          visible:
            text: "Delete"
            enabled: true
          timeout: 30000
          label: "Wait for the delete button to be enabled"

      - tapOn:
          text: "Delete"
          label: "Tap on the delete button"

      - extendedWaitUntil:
          visible:
            text: "Delete Photo"
          timeout: 30000
          label: "Wait for the deletion confirmation to appear"

      - tapOn:
          text: "Delete Photo"
          label: "Confirm the deletion"

      - extendedWaitUntil:
          notVisible:
            text: "Delete Photo"
          timeout: 30000
          label: "Wait for the deletion confirmation to close"
