appId: "com.recipedia"
---
- repeat:
    while:
      visible:
        id: "PXGGridLayout-Info"
    commands:
      - runFlow:
          when:
            visible:
              text: "Continue"
          commands:
            - tapOn:
                text: "Continue"
                label: "Close the what's new screen"
          label: "Dismiss what's new screen if it appeared late"

      - tapOn:
          text: "Select"
          label: "Enter select mode"

      - extendedWaitUntil:
          visible:
            text: "Select Items"
          timeout: 30000
          label: "Wait for select mode"

      - tapOn:
          id: "PXGGridLayout-Info"
          below:
            id: "PXCuratedLibraryUIView"
          index: 0
          label: "Select the first photo fully below the library header"

      - extendedWaitUntil:
          visible:
            text: "Delete"
            enabled: true
          timeout: 30000
          label: "Wait for the delete button to be enabled"

      - tapOn:
          text: "Delete"
          label: "Tap on the delete button"

      - extendedWaitUntil:
          visible:
            text: "Delete Photo"
          timeout: 30000
          label: "Wait for the deletion confirmation to appear"

      - tapOn:
          text: "Delete Photo"
          label: "Confirm the deletion"

      - extendedWaitUntil:
          notVisible:
            text: "Delete Photo"
          timeout: 30000
          label: "Wait for the deletion confirmation to close"
