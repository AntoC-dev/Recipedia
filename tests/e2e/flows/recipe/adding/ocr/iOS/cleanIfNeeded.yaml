appId: "com.recipedia"
---
# Every second spent here is spent with Recipedia in the background, where iOS can
# terminate it. Wait on concrete elements, never on fixed delays.
- launchApp:
    appId: "com.apple.mobileslideshow"
    label: "Open iOS Photos app"

- extendedWaitUntil:
    visible:
      text: "Library"
    timeout: 30000
    label: "Wait for Photos library"

- runFlow:
    file: "cleanupPhotos.yaml"
    label: "Delete all photos from library"

- stopApp:
    appId: "com.apple.mobileslideshow"
    label: "Close Photos app"
