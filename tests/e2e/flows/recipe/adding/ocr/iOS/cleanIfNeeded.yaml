appId: "com.recipedia"
---
# Every second spent here is spent with Recipedia in the background, where iOS can
# terminate it. Wait on concrete elements, never on fixed delays.
- launchApp:
    appId: "com.apple.mobileslideshow"
    label: "Open iOS Photos app"

- extendedWaitUntil:
    visible:
      text: "Library|Continue"
    timeout: 30000
    label: "Wait for Photos library or its what's new screen"

- runFlow:
    when:
      visible:
        text: "Continue"
    commands:
      - tapOn:
          text: "Continue"
          label: "Close the what's new screen"
      - extendedWaitUntil:
          visible:
            text: "Library"
          timeout: 30000
          label: "Wait for Photos library"

- runFlow:
    when:
      visible:
        id: "PXGGridLayout-Info"
    commands:
      - runFlow:
          file: "cleanupPhotos.yaml"
          label: "Delete all photos from library"
    label: "Clean up photos if any exist"

- stopApp:
    appId: "com.apple.mobileslideshow"
    label: "Close Photos app"
