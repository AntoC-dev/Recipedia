appId: "com.recipedia"
---
- runFlow:
    file: "../../../../handlePhotosPermission.yaml"
    label: "Clear the Photos permission prompt before the picker can present"

- extendedWaitUntil:
    visible:
      text: "Recents"
    timeout: 15000
    label: "Wait for the native photo picker to present"

- waitForAnimationToEnd:
    timeout: 3000
    label: "Let the picker presentation animation settle before tapping"

- tapOn:
    text: "Recents"
    label: "Go to recents photos"

- extendedWaitUntil:
    visible:
      text: "\\d+ Photo.*"
    timeout: 30000
    label: "Wait for gallery grid to load"

- waitForAnimationToEnd:
    timeout: 3000
    label: "Let the album grid finish sliding in before tapping a cell"

- runFlow:
    file: "../../../../selectFirstGalleryPhotoIOS.yaml"
    label: "Select first photo of the gallery"

- waitForAnimationToEnd:
    timeout: 3000
    label: "Let the selection register before asserting the picker dismissed"

- extendedWaitUntil:
    notVisible:
      id: "Recents"
    timeout: 10000
    label: "Wait for native photo picker to dismiss after selection"
