appId: "com.recipedia"
---
- runFlow:
    file: "../../../../waitForIOSPhotoPicker.yaml"
    label: "Wait for the photo picker, granting Photos access if prompted"

- tapOn:
    text: "Recents"
    retryTapIfNoChange: true
    label: "Go to recents photos"

- extendedWaitUntil:
    visible:
      text: "\\d+ Photo.*"
    timeout: 30000
    label: "Wait for gallery grid to load"

- runFlow:
    file: "../../../../selectFirstGalleryPhotoIOS.yaml"
    label: "Select first photo of the gallery"

- waitForAnimationToEnd:
    timeout: 3000
    label: "Let the selection register before asserting the picker dismissed"

- extendedWaitUntil:
    notVisible:
      id: "Recents"
    timeout: 10000
    label: "Wait for native photo picker to dismiss after selection"
