appId: "com.recipedia"
---
# TODO: Implement iOS version in ../iOS/waitAndVerifyGalleryReady.yaml

- extendedWaitUntil:
    visible:
      id: "icon_thumbnail"
      index: ${(output.galleryPhotoCount || 1) - 1}
    timeout: 3000
    optional: true
    label: "Check the picker lists ${output.galleryPhotoCount || 1} photos"

- runFlow:
    when:
      notVisible:
        id: "icon_thumbnail"
        index: ${(output.galleryPhotoCount || 1) - 1}
    commands:
      - retry:
          maxRetries: 10
          commands:
            - pressKey:
                key: "Back"
                label: "Close the picker to force a refresh"

            - runFlow:
                when:
                  visible:
                    id: "Modal::Gallery::RoundButton"
                commands:
                  - tapOn:
                      id: "Modal::Gallery::RoundButton"
                      label: "Reopen gallery from the modal"

            # FAB IDs use regex pattern because React Native Paper adds suffix on iOS
            - runFlow:
                when:
                  visible:
                    id: "ExpandButton.*"
                commands:
                  - runFlow:
                      file: "../../../../fab/expand.yaml"
                      label: "Expand FAB menu"
                  - tapOn:
                      id: "GalleryButton.*"
                      label: "Reopen gallery from the FAB"

            - extendedWaitUntil:
                visible:
                  id: "icon_thumbnail"
                  index: ${(output.galleryPhotoCount || 1) - 1}
                timeout: 3000
                label: "Wait for ${output.galleryPhotoCount || 1} photos in the picker after reopening"
