      TARGET_ID: "RecipeIngredients::4::QuantityInput"
      VALUE: "1"
    label: "Fill gousse d'ail quantity: 1"

- runFlow:
    file: "../../../../toolbarNext.yaml"
    label: "Skip the name of ingredient 5"

- runFlow:
    file: "../../../../inputAndNext.yaml"
