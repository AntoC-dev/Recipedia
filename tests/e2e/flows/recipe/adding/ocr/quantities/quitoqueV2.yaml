      TARGET_ID: "RecipeIngredients::2::QuantityInput"
      VALUE: "2"
    label: "Fill filet de poulet quantity: 2"

- runFlow:
    file: "../../../../toolbarNext.yaml"
    label: "Skip the name of ingredient 3"

