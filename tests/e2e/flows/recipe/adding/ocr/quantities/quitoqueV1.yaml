appId: "com.recipedia"
---
- scrollUntilVisible:
    element:
      id: "RecipeIngredients::0::QuantityInput"
    speed: 20
    direction: DOWN
    centerElement: true
    label: "Scroll to the first quantity with the keyboard closed"

- waitForAnimationToEnd

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::QuantityInput"
    label: "Focus the first quantity"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::QuantityInput"
      VALUE: "1"
    label: "Fill Carotte quantity: 1"

- runFlow:
    file: "../../../../toolbarNext.yaml"
    label: "Skip the name of ingredient 1"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::1::QuantityInput"
      VALUE: "1"
    label: "Fill Cumin quantity: 1"

- runFlow:
    file: "../../../../toolbarNext.yaml"
    label: "Skip the name of ingredient 2"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::2::QuantityInput"
      VALUE: "4"
    label: "Fill Merguez quantity: 4"

- runFlow:
    file: "../../../../toolbarNext.yaml"
    label: "Skip the name of ingredient 3"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::3::QuantityInput"
      VALUE: "1"
    label: "Fill Navet quantity: 1"

- runFlow:
    file: "../../../../toolbarNext.yaml"
    label: "Skip the name of ingredient 4"

- runFlow:
    file: "../../../../inputAndDone.yaml"
    env:
      TARGET_ID: "RecipeIngredients::4::QuantityInput"
      VALUE: "400"
    label: "Fill Pommes de terre quantity: 400"

