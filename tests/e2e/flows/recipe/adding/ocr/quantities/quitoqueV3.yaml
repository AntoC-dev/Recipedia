appId: "com.recipedia"
---
- scrollUntilVisible:
    element:
      id: "RecipeIngredients::8::DeleteButton"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll to ingredient to delete"

- tapOn:
    id: "RecipeIngredients::8::DeleteButton"
    label: "Delete the 'conserve' line as it is not an ingredient to keep"

- extendedWaitUntil:
    notVisible: "RecipeIngredients::11::.*"
    timeout: 5000
    label: "Wait for ingredient to be deleted"

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::0::QuantityInput"
    direction: UP
    speed: 20
    centerElement: true
    label: "Scroll back to top of ingredients"

- waitForAnimationToEnd

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::QuantityInput"
    label: "Focus the first quantity"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::QuantityInput"
      VALUE: "2"
    label: "Fill Carotte quantity: 2"

- runFlow:
    file: "../../../../toolbarNext.yaml"
    label: "Skip the name of ingredient 0"

- runFlow:
    file: "../../../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::1::QuantityInput"
      VALUE: "2"
    label: "Fill Citronnelle quantity: 2"

