appId: "com.recipedia"
---
- scrollUntilVisible:
    element:
      id: "RecipeDescription::OpenModal::(RoundButton|IconButton)"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll to description section"

- waitForAnimationToEnd

- tapOn:
    id: "RecipeDescription::OpenModal::(RoundButton|IconButton)"
    label: "Tap on OCR button of recipe description"

- runFlow:
    file: addAndSelectMostRecent.yaml
    env:
      FIELD_NAME: description

- extendedWaitUntil:
    visible:
      id: "RecipeDescription::CustomTextInput"
    timeout: 30000
    label: "Wait for description to be populated by OCR"
