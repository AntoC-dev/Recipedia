appId: "com.recipedia"
---
- waitForAnimationToEnd:
    timeout: 2000

- runFlow:
    file: "../../../../scrollToEndTarget.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionEmptyState::OCRButton::RoundButton"
    label: "Scroll to nutrition section"

- tapOn:
    id: "Recipe::RecipeNutrition::NutritionEmptyState::OCRButton::RoundButton"
    label: "Tap on OCR button for nutrition"

- runFlow:
    file: ../android/addMedia.yaml
    env:
      FIELD_NAME: nutrition
    when:
      platform: Android
- runFlow:
    file: ../iOS/addMedia.yaml
    env:
      FIELD_NAME: nutrition
    when:
      platform: iOS

- runFlow:
    file: ../android/selectMostRecentFromModal.yaml
    label: "Select nutrition from modal for OCR"
    when:
      platform: Android
- runFlow:
    file: ../iOS/selectMostRecentFromModal.yaml
    label: "Select nutrition from modal for OCR"
    when:
      platform: iOS

- extendedWaitUntil:
    visible:
      id: "Recipe::RecipeNutrition::NutritionTable"
    timeout: 120000
    label: "Wait for nutrition values to be populated by OCR"

- waitForAnimationToEnd:
    timeout: 2000

- runFlow:
    file: "../../../../scrollToEndTarget.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::EditForm::PortionWeightNumericTextInput"
    label: "Scroll to Recipe::RecipeNutrition::NutritionTable::EditForm::PortionWeightNumericTextInput"

- runFlow:
    file: "../../../../focusField.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::EditForm::PortionWeightNumericTextInput"
    label: "Tap on weight input"

- runFlow:
    file: "../../../../inputAndDone.yaml"
    env:
      TARGET_ID: "Recipe::RecipeNutrition::NutritionTable::EditForm::PortionWeightNumericTextInput"
      VALUE: "200"
    label: "Enter the weight of a portion"

- scrollUntilVisible:
    element:
      id: "RecipePreparation::PrefixText"
    direction: UP
    speed: 30
    centerElement: true
    label: "Scroll to up back to preparation section"
