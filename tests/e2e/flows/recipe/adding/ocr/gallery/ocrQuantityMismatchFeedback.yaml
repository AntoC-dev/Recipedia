appId: "com.recipedia"
---
- extendedWaitUntil:
    notVisible:
      id: "Recipe::OcrSnackbar"
    timeout: 30000
    label: "Wait for any previous snackbar to auto-dismiss"

- waitForAnimationToEnd

- repeat:
    times: ${ROWS_TO_ADD}
    commands:
      - scrollUntilVisible:
          element:
            id: "RecipeIngredients::AddButton::RoundButton"
          direction: DOWN
          speed: 20
          centerElement: true
          label: "Center the add-ingredient button"
      - tapOn:
          id: "RecipeIngredients::AddButton::RoundButton"
          label: "Add an empty ingredient row"
      - waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "RecipeIngredients::OpenModalQuantities::RoundButton"
    direction: DOWN
    speed: 20
    centerElement: true
    label: "Scroll to ingredient quantities OCR button"

- tapOn:
    id: "RecipeIngredients::OpenModalQuantities::RoundButton"
    label: "Tap on ingredient quantities OCR button"

- runFlow:
    file: ../android/addMedia.yaml
    env:
      RECIPE_NAME: quitoqueV1
      FIELD_NAME: ingredientQuantities
    label: "Add the quantities image to the gallery"
    when:
      platform: Android
- runFlow:
    file: ../iOS/addMedia.yaml
    env:
      RECIPE_NAME: quitoqueV1
      FIELD_NAME: ingredientQuantities
    label: "Add the quantities image to the gallery"
    when:
      platform: iOS

- runFlow:
    file: ../android/selectMostRecentFromModal.yaml
    label: "Select quantities image from modal for OCR"
    when:
      platform: Android
- runFlow:
    file: ../iOS/selectMostRecentFromModal.yaml
    label: "Select quantities image from modal for OCR"
    when:
      platform: iOS

- extendedWaitUntil:
    visible:
      text: "Scanned quantities don't match your ingredients. Please check the values."
    timeout: 120000
    label: "Wait for the quantity-mismatch snackbar message"
