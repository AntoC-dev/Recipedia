appId: "com.recipedia"
---
- tapOn:
    id: "RecipeTitle::OpenModal::(RoundButton|IconButton)"
    label: "Tap on OCR button of recipe title"

- runFlow:
    file: addAndSelectMostRecent.yaml
    env:
      FIELD_NAME: title

- extendedWaitUntil:
    visible:
      id: "RecipeTitle::CustomTextInput"
    timeout: 60000
    label: "Wait for title to be populated by OCR"
