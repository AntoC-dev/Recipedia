appId: "com.recipedia"
---
# FAB IDs use regex pattern because React Native Paper adds "-container-outer-layer" suffix on iOS
- tapOn:
    id: "ReduceButton.*"
    label: "Collapse FAB menu"

- extendedWaitUntil:
    visible:
      id: "ExpandButton.*"
    timeout: 20000
    label: "Wait for FAB menu to close"
