appId: "com.recipedia"
---
# FAB IDs use regex pattern because React Native Paper adds "-container-outer-layer" suffix on iOS
# A tap during the mount animation is ignored; retry once
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          id: "ExpandButton.*"
          point: "50%, 20%"
          label: "Tap FAB expand button"

      - extendedWaitUntil:
          visible:
            id: "ReduceButton.*"
          timeout: 3000
          label: "Wait for FAB menu to open"
