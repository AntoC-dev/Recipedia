appId: "com.recipedia"
---
# FAB IDs use regex pattern because React Native Paper adds "-container-outer-layer" suffix on iOS
# A tap during the mount animation is ignored; retry once
- tapOn:
    id: "ExpandButton.*"
    point: "50%, 20%"
    label: "Tap FAB expand button"

- extendedWaitUntil:
    visible:
      id: "ReduceButton.*"
    timeout: 3000
    optional: true
    label: "Wait for FAB menu to open"

- runFlow:
    when:
      notVisible:
        id: "ReduceButton.*"
    commands:
      - tapOn:
          id: "ExpandButton.*"
          point: "50%, 20%"
          label: "Retry FAB expand tap ignored during mount"

- extendedWaitUntil:
    visible:
      id: "ReduceButton.*"
    timeout: 5000
    label: "Assert FAB menu is expanded"
