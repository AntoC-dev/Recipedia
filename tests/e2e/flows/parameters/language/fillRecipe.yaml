appId: "com.recipedia"
---
- runFlow:
    file: "../../recipe/adding/fr/addRecipeImage.yaml"
    label: "Add recipe image in French"

- runFlow:
    file: "../../recipe/addRow.yaml"
    env:
      SECTION: "RecipeIngredients"
    label: "Add the ingredient row"

- runFlow:
    file: "../../recipe/addRow.yaml"
    env:
      SECTION: "RecipePreparation"
    label: "Add the preparation step"

- scrollUntilVisible:
    element:
      id: "RecipeTitle::CustomTextInput"
    speed: 20
    direction: UP
    centerElement: true
    label: "Scroll to the title with the keyboard closed"

- runFlow:
    file: "../../focusField.yaml"
    env:
      TARGET_ID: "RecipeTitle::CustomTextInput"
    label: "Focus the title"

- runFlow:
    file: "../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeTitle::CustomTextInput"
      VALUE: "Titre"
    label: "Write a title, Next moves to the description"

- runFlow:
    file: "../../toolbarNext.yaml"
    label: "Skip the description"

- runFlow:
    file: "../../toolbarNext.yaml"
    label: "Skip the persons"

- runFlow:
    file: "../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::NameInput::CustomTextInput"
      VALUE: "Avocado"
    label: "Write an ingredient name in the input text (exact match, Next moves to its quantity)"

- runFlow:
    file: "../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeIngredients::0::QuantityInput"
      VALUE: "200"
    label: "Fill first ingredient quantity: 200, Next moves to the time"

- runFlow:
    file: "../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipeTime::NumericTextInput"
      VALUE: "5"
    label: "Write a time, Next moves to the step title"

- runFlow:
    file: "../../inputAndNext.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::0::TextInputTitle::CustomTextInput"
      VALUE: "Titre de preparation"
    label: "Write a preparation title, Next moves to the content"

- runFlow:
    file: "../../inputAndDone.yaml"
    env:
      TARGET_ID: "RecipePreparation::EditableStep::0::TextInputContent::CustomTextInput"
      VALUE: "Etape de la preparation"
    label: "Write a preparation content and close the keyboard"
