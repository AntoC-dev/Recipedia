appId: "com.recipedia"
---
- runFlow:
    file: "typeInSettingsSearch.yaml"
    label: "Type ${SEARCH_QUERY} in the settings search bar"

- extendedWaitUntil:
    visible:
      id: "${SETTINGS_SCREEN}::\\d+::.*"
      text: ".*${SEARCH_QUERY}.*"
    timeout: 60000
    label: "Wait for searched item to be visible"
