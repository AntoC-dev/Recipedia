appId: "com.recipedia"
---
# Wait for the keyboard to appear - platform specific
# iOS: waits for UIKit's keyboard layout view. `UIKeyboardLayoutStar` backs every
# keyboard the app raises — alphabetic, numeric and decimal alike — so one wait
# covers all of them. Matching the view beats matching a key label: it does not
# depend on which return key a field declares (numeric keyboards have none), nor
# on the device locale, which translates "Done" and "Delete".
# Android: the IME is not in the view hierarchy, so it cannot be asserted
# present; just wait for the appearance animation.

- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: "UIKeyboardLayoutStar.*"
          timeout: 25000
          label: "Wait for the iOS keyboard to be up"

- waitForAnimationToEnd:
    label: "Wait for Android keyboard animation"
